<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Killeshin GAA — Fixtures, Results &amp; News</title>
<meta name="description" content="Every Killeshin fixture, result, league table and news story — men's and ladies, senior down to U12. Updated daily.">
<meta name="theme-color" content="#0B3D24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Killeshin GAA">
<link rel="apple-touch-icon" href="crest.png">
<link rel="icon" href="crest.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#0B3D24; --green:#17924A; --green-dk:#116136; --green-lt:#EAF4EE;
  --ink:#0F1512; --grey:#6B776F; --grey-lt:#98A29B;
  --line:#E4E8E5; --line-dk:#CBD3CD; --paper:#fff; --paper-2:#F7F9F7;
  --crest:url(crest.png);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Archivo,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.dsp{font-family:'Bricolage Grotesque',Archivo,Arial,sans-serif;font-weight:800;
  letter-spacing:-.035em;line-height:.98}
.lbl{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ── masthead + branch switch ───────────────────────────── */
.mast{background:var(--forest);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 20px 0}
.mast .top{display:flex;align-items:center;gap:11px;padding-bottom:13px}
.mast .top img{width:32px;height:32px;object-fit:contain;filter:brightness(0) invert(1)}
.mast h1{font-size:14.5px;font-weight:700}
.mast h1 span{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:#6FA787;display:block;margin-top:2px}
.branch{display:flex;gap:0}
.br{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 4px 10px;
  font-size:12px;font-weight:700;letter-spacing:.05em;color:#7FAE92;
  border-bottom:3px solid transparent}
.br img{width:21px;height:21px;object-fit:contain;filter:brightness(0) invert(1);opacity:.5}
.br[aria-pressed="true"]{color:#fff;border-bottom-color:var(--green)}
.br[aria-pressed="true"] img{opacity:1}

/* ── hero ───────────────────────────────────────────────── */
.hero{background:var(--forest);color:#fff;padding:20px 20px 26px;position:relative;overflow:hidden;
  border-top:1px solid rgba(255,255,255,.09)}
.hero::after{content:"";position:absolute;right:-72px;top:-46px;width:270px;height:270px;
  background:var(--crest) no-repeat center/contain;filter:brightness(0) invert(1);
  opacity:.055;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .rail{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,.14)}
.hero .rail .lbl{color:#6FA787}
.hero .rail .cd{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;white-space:nowrap}
.teams{padding:19px 0 0}
.teams .t{font-size:30px;color:rgba(255,255,255,.6);padding:1px 0}
.teams .t.us{color:#fff}
.teams .t.us::before{content:"";display:inline-block;width:9px;height:9px;background:var(--green);
  border-radius:50%;margin-right:11px;vertical-align:middle;transform:translateY(-3px)}
.teams .t:not(.us){padding-left:20px}
.hero .when{margin-top:19px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hero .when .d{font-size:25px}
.hero .when .x{font-size:12.5px;color:#8FBBA0;font-weight:500}
.hero .det{margin-top:12px;font-size:13px;color:#8FBBA0;line-height:1.6}
.hero .det b{color:#fff;font-weight:600}

.athome{display:flex;align-items:center;gap:13px;padding:13px 20px;
  background:var(--green-lt);border-bottom:1px solid #D6E6DC}
.athome img{width:30px;height:30px;object-fit:contain;flex:none}
.athome .lbl{color:var(--green-dk)}
.athome .l{font-size:15px;font-weight:700;margin-top:3px}
.athome .s{font-size:12.5px;color:var(--green-dk);font-weight:500}

/* ── nav ────────────────────────────────────────────────── */
.nav{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs{display:flex;padding:0 12px}
.tab{flex:1;padding:15px 2px 12px;font-size:11px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--grey-lt);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.filters{display:flex;gap:14px;overflow-x:auto;padding:11px 20px;scrollbar-width:none;
  border-top:1px solid var(--line);background:var(--paper-2);align-items:center}
.filters::-webkit-scrollbar{display:none}
.filters[hidden]{display:none}
.chip{flex:none;font-size:12.5px;font-weight:600;color:var(--grey);white-space:nowrap;
  padding:2px 0;border-bottom:2px solid transparent}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.sep{flex:none;width:1px;height:16px;background:var(--line-dk)}
.home-t{flex:none;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  color:var(--grey);white-space:nowrap;padding:3px 10px 3px 8px;border:1px solid var(--line-dk);
  border-radius:999px}
.home-t::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line-dk)}
.home-t[aria-pressed="true"]{color:#fff;background:var(--green-dk);border-color:var(--green-dk)}
.home-t[aria-pressed="true"]::before{background:#fff}

/* ── lists ──────────────────────────────────────────────── */
main{padding-bottom:10px}
.dayhead{display:flex;align-items:center;gap:12px;padding:24px 20px 9px}
.dayhead b{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--grey);white-space:nowrap}
.dayhead i{flex:1;height:1px;background:var(--line);font-style:normal}
.dayhead.soon b{color:var(--green-dk)}
.dayhead.soon i{background:var(--green);opacity:.35}

.row{display:flex;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);position:relative}
.row.hm::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}
.row .time{font-size:15px;font-weight:700;min-width:44px;flex:none;padding-top:1px}
.row .mid{flex:1;min-width:0}
.row .mid .tt{font-size:15.5px;font-weight:500;line-height:1.35}
.row .mid .tt b{font-weight:700}
.row .mid .sub{font-size:12.5px;color:var(--grey);margin-top:4px;line-height:1.45}
.row .mid .sub .v{color:var(--green-dk);font-weight:600}
/* branch marker, only shown when both are mixed together */
.bm{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.09em;padding:1px 5px;
  border-radius:3px;margin-right:7px;vertical-align:1px}
.bm.men{background:var(--forest);color:#fff}
.bm.ladies{background:var(--green);color:#fff}

.row.res{padding:15px 20px}
.row.res.win::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}
.row.res.loss::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line-dk)}
.row.res.draw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grey-lt)}
.sl{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:1.5px 0}
.sl .n{font-size:15px;font-weight:500;color:var(--grey);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl.w .n{color:var(--ink);font-weight:700}
.sl .s{font-size:19px;flex:none;color:var(--grey)}
.sl.w .s{color:var(--ink)}
.sl .s em{font-style:normal;font-size:11px;font-weight:600;color:var(--grey-lt);margin-left:7px;
  font-family:Archivo,Arial,sans-serif;letter-spacing:0}

/* ── tables ─────────────────────────────────────────────── */
.tbl{border-bottom:8px solid var(--paper-2)}
.tbl .hd{padding:22px 20px 12px}
.tbl .hd h3{font-size:16px;line-height:1.25}
.tbl .hd .lbl{color:var(--green-dk);margin-bottom:7px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grey-lt);
  text-align:right;padding:0 3px 8px;border-bottom:1px solid var(--line)}
th.t,td.t{text-align:left;width:100%}
th.t,td.t{padding-left:20px}
td.t{font-weight:500}
th.p,td.p{padding-right:20px}
td{padding:11px 3px;text-align:right;border-bottom:1px solid var(--line);color:var(--grey)}
td.t,td.p{color:var(--ink)}
td.p{font-weight:700}
tr:last-child td{border-bottom:0}
tr.us td{background:var(--green-lt);color:var(--ink);font-weight:700}
tr.us td.t{box-shadow:inset 3px 0 0 var(--green)}

/* ── news ───────────────────────────────────────────────── */
.sec{padding:26px 20px 10px}
.sec h2{font-size:19px}
.sec .lbl{color:var(--green-dk);display:block;margin-bottom:8px}
.sec p{margin:7px 0 0;font-size:13px;color:var(--grey);line-height:1.55}
.story{display:block;padding:16px 20px;border-bottom:1px solid var(--line)}
.story h3{font-size:16px;font-weight:600;line-height:1.38;letter-spacing:-.01em}
.story.lead h3{font-size:23px;font-weight:800;line-height:1.2;letter-spacing:-.03em;
  font-family:'Bricolage Grotesque',Archivo,Arial,sans-serif}
.story .by{margin-top:9px;font-size:11px;color:var(--grey);font-weight:600;
  letter-spacing:.05em;text-transform:uppercase}
.story .by b{color:var(--green-dk);font-weight:700}
.story .by s{text-decoration:none;color:var(--grey-lt)}
.paid{background:var(--paper-2);border-top:1px solid var(--line)}
.paid .story{border-bottom-color:#E8ECE9}
.paid .story:last-child{border-bottom:0}

/* ── alerts ─────────────────────────────────────────────── */
.alert{margin:0;padding:26px 20px 28px;background:var(--paper-2);border-top:1px solid var(--line)}
.alert .lbl{color:var(--green-dk);display:block;margin-bottom:8px}
.alert h2{font-size:19px;margin-bottom:8px}
.alert p{margin:0 0 16px;font-size:13.5px;color:var(--grey);line-height:1.6}
.alert p b{color:var(--ink);font-weight:600}
.btn{display:block;background:var(--forest);color:#fff;text-align:center;padding:15px;
  font-size:14px;font-weight:700;letter-spacing:.03em;margin-bottom:9px}
.btn.alt{background:var(--paper);color:var(--forest);box-shadow:inset 0 0 0 2px var(--forest)}
.alert .fine{font-size:12px;color:var(--grey-lt);line-height:1.6;margin:14px 0 0}

/* ── footer / empty ─────────────────────────────────────── */
.foot{background:var(--forest);color:#7FA890;padding:26px 20px calc(30px + env(safe-area-inset-bottom));
  font-size:12px;line-height:1.75;display:flex;gap:15px;align-items:flex-start}
.foot img{width:34px;height:34px;object-fit:contain;flex:none;filter:brightness(0) invert(1);opacity:.55}
.foot a,.foot b{color:#fff;font-weight:600}
.empty{padding:52px 32px 60px;text-align:center;color:var(--grey)}
.empty img{width:50px;height:50px;object-fit:contain;opacity:.16;margin:0 auto 16px;display:block}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:7px;
  font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;letter-spacing:-.02em}
.empty span{font-size:13.5px;line-height:1.55;display:block;max-width:280px;margin:0 auto}
@media (min-width:620px){
  body{max-width:600px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .teams .t{font-size:35px}
}
</style>
</head>

  <div class="top">

  if(!pool.length){ hero.hidden = true; } else {
    var f = pool[0], n = daysAway(f.date);
    hero.hidden = false;
    hero.style.setProperty('--crest', 'url(' + crestOf(f.branch) + ')');
    document.getElementById('heroLbl').textContent =
      mixed() ? (f.branch==='men' ? "Next match \u00b7 Men's" : 'Next match \u00b7 Ladies') : 'Next match';
    document.getElementById('heroCd').textContent =
      n===0 ? 'Today' : n===1 ? 'Tomorrow' : 'In ' + n + ' days';
    document.getElementById('tA').textContent = 'Killeshin';
    document.getElementById('tB').textContent = label(f.opponent, f.branch);
    document.getElementById('heroTime').textContent = f.time;
    document.getElementById('heroDate').textContent =
      longDate(f.date) + (atHome(f) ? '  \u00b7  At home' : '  \u00b7  Away');
    document.getElementById('heroDet').innerHTML = f.grade + ' \u00b7 ' + esc(f.competition) +
      '<br><b>' + esc(f.venue) + '</b>' +
      (f.referee && f.referee!=='TBC' ? '  \u00b7  Ref ' + esc(f.referee) : '');
  }

  var hm = upcoming().filter(function(f){
    return (branch==='all' || f.branch===branch) && atHome(f); })[0];
  var box = document.getElementById('athome');
  /* Skip it when the very next match is already the home one. */
  if(!hm || (pool.length && hm === pool[0])){ box.hidden = true; return; }
  box.hidden = false;
  document.getElementById('ahCrest').src = crestOf(hm.branch);
  document.getElementById('ahLine').textContent =
    (mixed() ? (hm.branch==='men' ? "Men's " : 'Ladies ') : '') + hm.grade + '  v  ' + label(hm.opponent, hm.branch);
  document.getElementById('ahSub').textContent =
    shortDate(hm.date) + '  \u00b7  ' + hm.time + '  \u00b7  ' + (DATA.ground || hm.venue);
}

/* ---- fixtures ---- */
function renderFixtures(){
  var list = pick(upcoming());
  if(!list.length) return empty('Nothing down yet', emptyWhy('fixtures'));
  var html='', day=null;
  list.forEach(function(f){
    if(f.date!==day){
      day=f.date; var n=daysAway(f.date);
      html += dayRule(longDate(f.date) + (n===0?' \u2014 today':n===1?' \u2014 tomorrow':''), n<=2);
    }
    html += '<div class="row'+(atHome(f)?' hm':'')+'">' +
      '<div class="time num">'+esc(f.time)+'</div><div class="mid">' +
      '<div class="tt">'+mark(f)+teamLine(f)+'</div>' +
      '<div class="sub">'+esc(f.grade)+' \u00b7 '+esc(f.competition)+'<br>' +
        (atHome(f) ? '<span class="v">'+esc(f.venue)+' \u00b7 home</span>' : esc(f.venue)) +
      '</div></div></div>';
  });
  return html;
}
function dayRule(text, soon){
  return '<div class="dayhead'+(soon?' soon':'')+'"><b>'+esc(text)+'</b><i></i></div>';
}
function teamLine(m){
  var us = ourName(m.branch), H = m.home===us, A = m.away===us;
  return (H?'<b>':'')+esc(label(m.home,m.branch))+(H?'</b>':'') + ' v ' +
         (A?'<b>':'')+esc(label(m.away,m.branch))+(A?'</b>':'');
}

/* ---- results ---- */
function renderResults(){
  var list = pick(DATA.results);
  if(!list.length) return empty('No results yet', emptyWhy('results'));
  var html='', day=null;
  list.forEach(function(r){
    if(r.date!==day){ day=r.date; html += dayRule(longDate(r.date), false); }
    var cls = r.outcome==='W' ? ' win' : r.outcome==='L' ? ' loss' : ' draw';
    html += '<div class="row res'+cls+'"><div class="mid">' +
      (mixed() ? '<div class="sub" style="margin:0 0 5px">'+mark(r)+'</div>' : '') +
      scoreLine(r, r.home, r.homeScore, r.homeTotal, r.homeTotal>r.awayTotal) +
      scoreLine(r, r.away, r.awayScore, r.awayTotal, r.awayTotal>r.homeTotal) +
      '<div class="sub">'+esc(r.grade)+' \u00b7 '+esc(r.competition)+'<br>'+esc(r.venue)+'</div>' +
      '</div></div>';
  });
  return html;
}
function scoreLine(m,n,sc,tot,won){
  return '<div class="sl'+(won?' w':'')+'"><div class="n">'+esc(label(n,m.branch))+'</div>' +
         '<div class="s dsp num">'+esc(sc)+'<em>'+tot+'</em></div></div>';
}

/* ---- tables ---- */
function renderTables(){
  var list = DATA.tables.filter(function(t){
    if(branch !== 'all' && t.branch !== branch) return false;
    return grade === 'All' || t.grade === grade;
  });
  if(!list.length) return empty('No table here',
    'Knockout and championship groups do not always run a league table.');
  return list.map(function(t){
    var us = ourName(t.branch);
    var rows = t.rows.map(function(r,i){
      return '<tr'+(r.team===us?' class="us"':'')+'><td class="t">' +
        '<span class="num" style="color:var(--grey-lt);margin-right:10px">'+(i+1)+'</span>' +
        esc(label(r.team,t.branch))+'</td><td class="num">'+r.p+'</td><td class="num">'+r.w+'</td>' +
        '<td class="num">'+r.d+'</td><td class="num">'+r.l+'</td><td class="num">'+r.f+'</td>' +
        '<td class="num">'+r.a+'</td><td class="p num">'+r.pts+'</td></tr>';
    }).join('');
    return '<section class="tbl"><div class="hd"><span class="lbl">' +
      (mixed() ? (t.branch==='men'?"Men's \u00b7 ":'Ladies \u00b7 ') : '') + esc(t.grade) + '</span>' +
      '<h3 class="dsp">'+esc(t.competition)+'</h3></div>' +
      '<table><thead><tr><th class="t">Team</th><th>P</th><th>W</th><th>D</th><th>L</th>' +
      '<th>F</th><th>A</th><th class="p">Pts</th></tr></thead><tbody>'+rows+'</tbody></table></section>';
  }).join('');
}

/* ---- news ---- */
function renderNews(){
  var all = DATA.news || [];
  if(!all.length) return empty('Nothing in the papers',
    'Anything the local papers publish about Killeshin lands here within a day.');
  var free = all.filter(function(n){ return n.access !== 'subscriber'; });
  var paid = all.filter(function(n){ return n.access === 'subscriber'; });
  var html = '';
  if(free.length){
    html += sec('Free to read','Open these and read the whole story, no account needed.') +
      free.map(function(n,i){ return story(n, i===0); }).join('');
  } else {
    html += empty('Nothing free this week','The subscriber stories below are all that came up.');
  }
  if(paid.length){
    html += '<div class="paid">' +
      sec('Behind a subscription','You will hit a paywall on these. Headline and link only.') +
      paid.map(function(n){ return story(n,false); }).join('') + '</div>';
  }
  return html;
}
function sec(t,p){ return '<div class="sec"><span class="lbl">'+esc(t)+'</span><p>'+esc(p)+'</p></div>'; }
function story(n, lead){
  var age = -daysAway(n.date), when = shortDate(n.date);
  if(age === 0) when = 'Today'; else if(age === 1) when = 'Yesterday';
  else if(age > 1 && age < 7) when = age + ' days ago';
  return '<a class="story'+(lead?' lead':'')+'" href="'+esc(n.url)+'" target="_blank" rel="noopener">' +
    '<h3>'+esc(n.title)+'</h3><div class="by"><b>'+esc(n.source)+'</b> <s>\u00b7</s> '+esc(when) +
    (n.tag ? ' <s>\u00b7</s> '+esc(n.tag) : '') +
    (n.access==='subscriber' ? ' <s>\u00b7</s> Subscribers' : '') + '</div></a>';
}

/* ---- alerts ----
   A static site can't push notifications on its own. Subscribing to the
   calendar feed does the same job using the phone's own reminders, updates
   itself, and only has to be set up once. */
function renderAlerts(){
  var host = location.host + location.pathname.replace(/[^/]*$/,'');
  var feeds = [
    ['all',    'Every Killeshin match',      "Men's and ladies, every team."],
    ['men',    "Men's fixtures only",        'Senior down to U13.'],
    ['ladies', 'Ladies fixtures only',       'Intermediate down to U12.'],
    ['home',   'Home games only',            'Anything at Seamus Hearns Park.']
  ];
  return '<div class="alert"><span class="lbl">Match alerts</span>' +
    '<h2 class="dsp">Get a reminder before every game</h2>' +
    '<p>Tap one below and your phone adds a Killeshin calendar. Every fixture appears ' +
    'automatically with <b>an alert two hours before throw-in</b>. New fixtures land in it ' +
    'on their own — you only do this once.</p>' +
    feeds.map(function(f,i){
      return '<a class="btn'+(i?' alt':'')+'" href="webcal://'+esc(host)+'killeshin-'+f[0]+'.ics">' +
             esc(f[1]) + '</a>';
    }).join('') +
    '<p class="fine"><b>iPhone:</b> tap a button, then Subscribe. <b>Android:</b> copy the link ' +
    'into Google Calendar under Other calendars \u2192 From URL.<br><br>' +
    'Times come from the county boards. If a game is moved, the calendar moves with it \u2014 ' +
    'but always check with the manager on the day.</p></div>';
}

function emptyWhy(kind){
  var who = branch==='men' ? "the men's teams" : branch==='ladies' ? 'the ladies teams' : 'any team';
  if(homeOnly) return 'No home ' + kind + ' match that filter. Turn off Home only to see away games too.';
  if(grade !== 'All') return 'Nothing for ' + grade + ' right now. Try another team above.';
  return kind === 'fixtures'
    ? 'Nothing down for ' + who + ' yet. New fixtures appear the morning after the county board publishes them.'
    : 'Once ' + who + ' play, the scores show up here.';
}
function empty(title,msg){
  return '<div class="empty"><img src="'+crestOf(branch==='ladies'?'ladies':'men')+'" alt="">' +
         '<b>'+esc(title)+'</b><span>'+esc(msg)+'</span></div>';
}

/* ---- shell ---- */
function grades(){
  if(branch === 'all'){
    var seen = {}, out = [];
    ['men','ladies'].forEach(function(b){
      (DATA.gradesBy[b]||[]).forEach(function(g){ if(!seen[g]){ seen[g]=1; out.push(g); } });
    });
    return out;
  }
  return DATA.gradesBy[branch] || [];
}
function filters(){
  var box = document.getElementById('filters');
  if(view === 'news' || view === 'alerts'){ box.hidden = true; return; }
  box.hidden = false;
  var chips = ['All'].concat(grades()).map(function(g){
    return '<button class="chip" aria-pressed="'+(g===grade)+'" data-g="'+esc(g)+'">'+esc(g)+'</button>';
  }).join('');
  var toggle = view === 'tables' ? '' :
    '<span class="sep"></span><button class="home-t" id="homeT" aria-pressed="'+homeOnly+'">Home only</button>';
  box.innerHTML = chips + toggle;
}
function draw(){
  document.getElementById('out').innerHTML =
    view==='fixtures' ? renderFixtures() :
    view==='results'  ? renderResults()  :
    view==='tables'   ? renderTables()   :
    view==='news'     ? renderNews()     : renderAlerts();
  filters();
  window.scrollTo(0,0);
}
document.getElementById('branch').addEventListener('click', function(e){
  var b = e.target.closest('.br'); if(!b) return;
  branch = b.dataset.b;
  /* A grade from one branch may not exist in the other, so reset it. */
  if(grade !== 'All' && grades().indexOf(grade) === -1) grade = 'All';
  document.querySelectorAll('.br').forEach(function(x){
    x.setAttribute('aria-pressed', String(x.dataset.b === branch)); });
  var m = branch==='ladies' ? 'ladies' : 'men';
  document.getElementById('mastCrest').src = crestOf(m);
  document.getElementById('mastSub').textContent =
    branch==='men' ? 'CLG Gleann Uiseann' : branch==='ladies' ? 'Killeshin Ladies' : "Men's and ladies";
  document.getElementById('src').href = br(m).source;
  renderNext(); draw();
});
document.getElementById('filters').addEventListener('click', function(e){
  var c = e.target.closest('.chip');
  if(c){ grade = c.dataset.g; draw(); return; }
  if(e.target.closest('#homeT')){ homeOnly = !homeOnly; draw(); }
});
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    view = t.dataset.view;
    document.querySelectorAll('.tab').forEach(function(x){
      x.setAttribute('aria-selected', String(x===t)); });
    draw();
  });
});
function stamp(){
  var u = new Date(DATA.updated);
  var same = u.toDateString() === new Date().toDateString();
  document.getElementById('stamp').textContent = 'Updated ' +
    (same ? 'today at ' + u.toTimeString().slice(0,5) : shortDate(DATA.updated.slice(0,10)));
  document.getElementById('src').href = br('men').source;
}
function boot(){ renderNext(); draw(); stamp(); }
boot();

fetch('killeshin.json?t=' + Date.now(), {cache:'no-store'})
  .then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(function(j){ if(j && j.fixtures && j.results){ DATA = j; boot(); } })
  .catch(function(){ /* keep the built-in copy */ });

})();
</script>
</body>
</html>
