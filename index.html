<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Killeshin GAA - Match Centre</title>
<meta name="description" content="Every Killeshin fixture, result, league table and news story — men's and ladies, senior down to U12. Updated hourly.">
<meta name="theme-color" content="#1F824A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Killeshin GAA">
<link rel="apple-touch-icon" href="crest.png">
<link rel="icon" href="crest.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- GoatCounter: visitor stats at https://killeshin.goatcounter.com
     No cookies, so no consent banner needed. -->
<script data-goatcounter="https://killeshin.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600;700&display=swap"></noscript>
<style>
:root{
  /* Deep near-black green for the dark areas, a brighter green for accents.
     The old mid-green read flat on a phone. */
  --deep:#11492E; --deep-2:#1D5C3C; --forest:#1F824A;
  --green:#3ACD77; --green-dk:#12703F; --green-lt:#E8F6EE;
  --ink:#101A14; --grey:#4E5A53; --grey-lt:#6B7A72;
  --line:#E2EAE5; --line-dk:#C2D0C7; --paper:#fff; --paper-2:#EFF4F0;
  --r:20px; --r-sm:13px;
  --crest:url(crest.png);
}
/* Green and white flecks: fine diagonal streaks laid over the dark panels.
   Two passes at different angles so it never looks like stripes. */
.flecked{position:relative;overflow:hidden}
.flecked::before{content:"";position:absolute;inset:-20%;pointer-events:none;
  background:
    repeating-linear-gradient(114deg,
      rgba(255,255,255,.055) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(114deg,
      rgba(58,205,119,.16) 0 2px, transparent 2px 34px),
    repeating-linear-gradient(66deg,
      rgba(255,255,255,.028) 0 1px, transparent 1px 17px);
  opacity:.9}
.flecked>*{position:relative;z-index:1}
*{box-sizing:border-box}
/* Every tappable element eases into its pressed/selected state instead of
   snapping - the :active and aria-pressed rules throughout this file already
   change transform, box-shadow and colour; this just makes those changes
   glide rather than jump. Left off .card and .feat, which use their own
   longer transform for the expand/collapse motion. */
.chip,.home-t,.ticket-t,.mine-btn,.mine-alt,.btn,.clear-filter,.ktabs button,
.gr,.br,.sheet button,.pick,.bar button,.tick,.dir,.picker .done,.picker .clear{
  transition:transform .1s ease,box-shadow .1s ease,background-color .12s ease,color .12s ease}
/* An explicit display: beats the hidden attribute, which has left empty
   boxes on the page twice now. This settles it for every element. */
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper-2);color:var(--ink);
  font-family:Archivo,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.55;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:10px}
.dsp{font-family:'Bricolage Grotesque',Archivo,Arial,sans-serif;font-weight:800;
  letter-spacing:-.03em;line-height:1.02}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ── masthead: the crest given room ─────────────────────── */
.mast{color:#fff;padding:calc(22px + env(safe-area-inset-top)) 20px 24px;
  display:flex;align-items:center;gap:16px;border-radius:0 0 28px 28px;
  background:
    linear-gradient(150deg, rgba(17,73,46,.76) 0%, rgba(17,73,46,.87) 68%),
    url(ground.jpg) center 38%/cover no-repeat, var(--deep)}
.mast .badge{width:72px;height:72px;flex:none;background:#fff;border-radius:50%;
  display:grid;place-items:center;overflow:hidden;
  box-shadow:0 0 0 3px rgba(58,205,119,.6)}
.mast .badge img{width:70%;height:70%;object-fit:contain;display:block}
.mast h1{font-size:25px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;
  font-family:'Bricolage Grotesque',Archivo,sans-serif;line-height:1}
.mast span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.28em;
  text-transform:uppercase;color:#7FCFA2;margin-top:8px}
/* Everything here is the club's own roadside-sign lettering, lifted from a photo of
   the sign: the name large, then the Irish greeting smaller underneath. The K and h
   are built from the sign's own strokes, as the sign has no letter of either. */
.mast .word{flex:1;min-width:0;max-width:250px}
.mast .word img{display:block;height:auto;width:100%}
.mast .word .ir{margin-top:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);
  white-space:nowrap}

/* ── branch switch: three big, obvious buttons ──────────── */
.branch{display:flex;gap:9px;padding:16px 16px 4px;margin-top:-16px}
.br{flex:1;background:var(--paper);border-radius:16px;padding:14px 6px 12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  font-size:13.5px;font-weight:700;color:var(--ink);
  border:1px solid var(--line);box-shadow:0 3px 12px rgba(17,73,46,.09);
  position:relative;overflow:hidden}
.br img{width:32px;height:32px;object-fit:contain;display:block}
.br .pair{display:flex;align-items:center;height:32px}
.br .pair img{width:26px;height:26px}
.br .pair img + img{margin-left:-8px}
.br[aria-pressed="true"] img{filter:brightness(0) invert(1)}
.br[aria-pressed="true"]{background:var(--forest);color:#fff;border-color:var(--deep)}
.br[aria-pressed="true"]::after{content:"";position:absolute;left:26%;right:26%;bottom:7px;
  height:3px;border-radius:999px;background:var(--green)}
.br:active{transform:translateY(1px)}

/* ── next match ─────────────────────────────────────────── */
.wrap{padding:14px 16px 0}
.hero{background:linear-gradient(160deg,var(--deep-2) 0%,var(--deep) 62%);
  color:#fff;border-radius:24px;padding:20px 18px 18px;
  box-shadow:0 8px 26px rgba(17,73,46,.22)}
.hero .cap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .cap .lbl{color:#8FD6AE;letter-spacing:.22em;font-size:10.5px}
.hero .cap .cd{display:inline-flex;align-items:center;gap:8px;background:var(--green);
  color:#04240F;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  padding:7px 14px;border-radius:999px;white-space:nowrap}
.hero .cap .cd svg{width:14px;height:14px;stroke:#04240F;stroke-width:2.1;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* crest, name, V, opponent - the shape of a matchday poster */
.vs{display:flex;align-items:center;gap:14px;margin:24px 0 18px}
.vs .crest{width:78px;height:78px;flex:none;background:#fff;border-radius:50%;
  display:grid;place-items:center;overflow:hidden;
  box-shadow:0 0 0 3px rgba(58,205,119,.55)}
.vs .crest img{width:69%;height:69%;object-fit:contain;display:block}
/* Where the county board has no crest for a club, a monogram in their place.
   Looks deliberate rather than like a missing image. */
.vs .mono{width:78px;height:78px;flex:none;border-radius:50%;display:grid;
  place-items:center;background:#fff;box-shadow:0 0 0 3px rgba(58,205,119,.55);
  font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;
  color:var(--deep);letter-spacing:.01em;line-height:1;position:relative}
.vs .mono span{position:relative;z-index:1;font-size:26px}
.vs .mono.long span{font-size:21px}
.vs .mono::before{content:"";position:absolute;inset:7px;border-radius:50%;
  border:1.5px solid rgba(17,73,46,.16)}
.vs .names{flex:1;min-width:0;text-align:center}
.vs .names b{display:block;font-family:'Bricolage Grotesque',Archivo,sans-serif;
  font-weight:800;font-size:22px;letter-spacing:.05em;text-transform:uppercase;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis}
.vs .names i{display:block;font-style:normal;color:var(--green);font-weight:800;
  font-size:15px;margin:5px 0;letter-spacing:.2em}
.vs .names b.them{color:#CFE8DA;font-size:19px}

.hero .comp{text-align:center;font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:#8FD6AE;padding-bottom:16px;line-height:1.6}
.meta{display:flex;gap:2px;border-top:1px solid rgba(255,255,255,.16);padding-top:15px}
.meta .m{flex:1;min-width:0;display:flex;gap:9px;align-items:flex-start;padding:0 6px}
.meta .m + .m{border-left:1px solid rgba(255,255,255,.14)}
.meta svg{width:17px;height:17px;flex:none;stroke:var(--green);stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.meta .m b{display:block;font-size:13.5px;font-weight:700;line-height:1.3}
.meta .m span{display:block;font-size:12px;color:#A9CFBB;margin-top:2px;line-height:1.35}
.heroref{display:flex;align-items:center;gap:9px;margin-top:13px;padding-top:13px;
  border-top:1px solid rgba(255,255,255,.16);font-size:13px;color:#D7EEDF}
.heroref svg{width:16px;height:16px;flex:none;stroke:#8FD6AE;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.hero .dir{background:rgba(58,205,119,.2);color:#C9F0DA;margin-top:15px;
  border:1px solid rgba(58,205,119,.45)}
.hero .wx{margin-top:14px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);border-radius:var(--r-sm);
  padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;line-height:1.4}
.hero .wx[hidden]{display:none}
.hero .wx .ico{font-size:20px;flex:none}
.hero .wx b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:#8FD6AE;margin-bottom:2px}
.hero .wx .soft{color:#DCEFE4}

/* ── next at home ───────────────────────────────────────── */
/* Given real weight - it is the one fixture most people care about, and it
   was disappearing as a plain white card between two strong panels. */
.athome{margin:12px 16px 0;border-radius:20px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#F2FBF6 0%,#E4F5EB 100%);
  border:1px solid rgba(31,130,74,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 5px 18px -6px rgba(17,73,46,.24)}
.athome::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--green),var(--green-dk))}
.athome::after{content:"";position:absolute;right:-24px;bottom:-28px;width:118px;height:118px;
  background:var(--crest) no-repeat center/contain;opacity:.05;pointer-events:none}
.athome .top{display:flex;align-items:center;gap:9px;padding:11px 16px 10px 19px;
  background:linear-gradient(90deg,rgba(31,130,74,.14),rgba(31,130,74,.03));
  border-bottom:1px solid rgba(31,130,74,.16);position:relative;z-index:1}
.athome .top svg{width:15px;height:15px;stroke:var(--green-dk);stroke-width:2.1;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.athome .lbl{color:var(--green-dk);letter-spacing:.19em;font-size:10.5px}
.athome .body{display:flex;gap:14px;align-items:flex-start;padding:15px 16px 16px 19px;
  position:relative;z-index:1}
.athome img{width:54px;height:54px;object-fit:contain;flex:none}
.athome .l{font-size:18px;font-weight:800;line-height:1.25;letter-spacing:-.01em;
  font-family:'Bricolage Grotesque',Archivo,sans-serif}
.athome .s{font-size:13.5px;color:var(--grey);margin-top:6px;display:flex;
  align-items:center;gap:8px;line-height:1.4}
.athome .s svg{width:15px;height:15px;flex:none;stroke:var(--green-dk);stroke-width:1.9;
  fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ── promo strip ────────────────────────────────────────── */
/* White, so it does not fight the dark match panel above it, with the club
   green carrying the accent. Reads as club business, not another fixture. */
.promo{display:block;margin:12px 16px 0;padding:0;text-decoration:none;
  background:var(--paper);border-radius:20px;border:1px solid var(--line);
  box-shadow:0 3px 14px rgba(17,73,46,.09);overflow:hidden;position:relative}
.promo .strap{display:flex;align-items:center;gap:9px;
  background:linear-gradient(90deg,var(--deep) 0%,var(--forest) 100%);
  padding:9px 16px;color:#fff}
.promo .strap svg{width:15px;height:15px;stroke:var(--green);stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.promo .strap span{font-size:10.5px;font-weight:800;letter-spacing:.19em;
  text-transform:uppercase}
.promo .inner{display:flex;align-items:center;gap:14px;padding:15px 16px 16px}
.promo .tx{flex:1;min-width:0}
.promo .tx b{display:block;font-size:17.5px;font-weight:800;line-height:1.25;
  font-family:'Bricolage Grotesque',Archivo,sans-serif;letter-spacing:-.01em;color:var(--ink)}
.promo .tx span{display:block;font-size:13px;color:var(--grey);margin-top:4px;line-height:1.45}
.promo .cta{flex:none;display:inline-flex;align-items:center;gap:7px;
  background:var(--green-lt);color:var(--green-dk);border:1px solid #BFDFCD;
  border-radius:999px;padding:9px 15px;font-size:13px;font-weight:800;white-space:nowrap}
.promo:active{transform:translateY(1px)}

/* ── nav ────────────────────────────────────────────────── */
/* Not pinned. At four rows tall it would cover half the screen and sit on
   top of short panels like Alerts. It scrolls away with everything else. */
.nav{background:var(--paper-2);padding-top:14px;
  scroll-margin-top:calc(env(safe-area-inset-top) + 10px)}
/* Bottom bar, the way a native app does it. Four everyday tabs plus More,
   which opens the rest in a sheet. Always in reach of a thumb. */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:grid;
  grid-template-columns:repeat(5,1fr);
  background:rgba(17,73,46,.96);-webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.1);
  padding-bottom:env(safe-area-inset-bottom)}
.bar button{display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:10px 2px 8px;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:#F0F7F3}
.bar svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.bar button{position:relative}
.bar button[aria-selected="true"]{color:#FFFFFF;font-weight:800}
.bar button[aria-selected="true"] svg{stroke-width:2.4;stroke:var(--green)}
.bar button[aria-selected="true"]::before{content:"";position:absolute;top:0;
  left:26%;right:26%;height:3px;border-radius:0 0 4px 4px;background:var(--green)}
.bar button:active{opacity:.55}

.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;
  background:rgba(10,30,20,.4);opacity:0;pointer-events:none;transition:opacity .16s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .panel{width:100%;background:var(--paper-2);border-radius:24px 24px 0 0;
  padding:10px 16px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(14px);transition:transform .16s}
.sheet.open .panel{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:999px;background:var(--line-dk);
  margin:0 auto 16px}
.sheet button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:15px 17px;margin-bottom:9px;border-radius:14px;font-size:16.5px;font-weight:700;
  background:var(--green-lt);color:var(--green-dk);border:1.5px solid #BFDFCD;
  box-shadow:0 3px 0 #BFDFCD}
.sheet button:active{box-shadow:0 1px 0 #BFDFCD;transform:translateY(2px)}
.sheet button[aria-selected="true"]{background:var(--forest);color:#fff;border-color:#0F5C34;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.28)}
.sheet button svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Raised buttons: a solid edge underneath does the lifting, and the selected
   one sinks into the page. Reads as pressable without any gloss. */
/* Teams on one line, Home only on its own beneath, so the toggle is always
   in view rather than off the end of a scrolling row. */
.filters{display:block;padding:12px 0 4px;min-height:52px}
/* overscroll-behavior-x stops a vertical page-scroll from leaking into this
   row's own horizontal scroll position - without it, iOS can occasionally
   read a finger scrolling the page as also scrolling the chips, and the row
   visibly shifts sideways. touch-action makes the same intent explicit for
   the touch gesture itself. */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none;
  overscroll-behavior-x:contain;touch-action:pan-x}
.searchrow{padding:10px 16px}
.searchrow .box{position:relative}
.searchrow input{width:100%;padding:10px 38px 10px 15px;border-radius:10px;
  font-size:14.5px;font-family:inherit;color:var(--ink);
  background:var(--paper);border:1px solid var(--line-dk)}
.searchrow input::placeholder{color:var(--grey-lt)}
.searchrow .clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  color:var(--grey-lt);font-size:13px}
.searchrow .clear:active{background:var(--paper-2)}
.chiprow::-webkit-scrollbar{display:none}
.homerow{display:flex;align-items:center;gap:9px;padding:10px 16px 0;flex-wrap:wrap}
.filters[hidden]{display:none}
.chip{flex:none;font-size:13.5px;font-weight:600;color:var(--green-dk);white-space:nowrap;
  padding:14px 15px;border-radius:10px;background:var(--green-lt);border:1px solid #BFDFCD;
  box-shadow:0 2px 0 #BFDFCD}
.chip:active{box-shadow:0 0 0 #BFDFCD;transform:translateY(2px)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.3);transform:translateY(1px)}
.home-t{flex:none;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;
  color:var(--green-dk);white-space:nowrap;padding:14px 15px 14px 13px;background:var(--green-lt);
  border:1px solid #BFDFCD;border-radius:10px;box-shadow:0 2px 0 #BFDFCD}
.home-t::before{content:"";width:8px;height:8px;border-radius:50%;background:#8FC3A4}
.home-t:active{box-shadow:none;transform:translateY(2px)}
.home-t[aria-pressed="true"]{color:#fff;background:var(--green-dk);border-color:#0F5C34;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.3);transform:translateY(1px)}
.home-t[aria-pressed="true"]::before{background:#fff}
.home-t[aria-pressed="true"]::before{background:#fff}

/* ── my teams ───────────────────────────────────────────── */
.mine-btn{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;
  font-weight:700;white-space:nowrap;padding:14px 15px 14px 13px;border-radius:10px;
  background:var(--green-lt);color:var(--green-dk);border:1px solid #BFDFCD;
  box-shadow:0 2px 0 #BFDFCD}
.mine-btn:active{box-shadow:none;transform:translateY(2px)}
.mine-btn .star{font-size:14px;line-height:1}

/* Buy tickets: same shape as Home only / My teams, but amber - matching the
   ticket pill already used on fixture cards, so the colour already means
   "tickets" everywhere else in the app before this button existed. */
.ticket-t{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;
  font-weight:700;white-space:nowrap;padding:14px 15px 14px 13px;border-radius:10px;
  color:#7A5210;background:linear-gradient(180deg,#FFFDF6,#FBF1DC);
  border:1px solid rgba(184,125,18,.4);box-shadow:0 2px 0 rgba(184,125,18,.3)}
.ticket-t:active{box-shadow:none;transform:translateY(2px)}

/* On the filtered page the team chips would sit there doing nothing, so they
   are replaced by a banner saying whose games these are. */
.minebar{display:flex;align-items:center;gap:11px;margin:0 16px;padding:11px 14px;
  border-radius:14px;background:linear-gradient(160deg,#F2FBF6,#E4F5EB);
  border:1px solid rgba(31,130,74,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.minebar .star{font-size:16px;color:var(--green-dk);flex:none}
.minebar .tx{flex:1;min-width:0}
.minebar .tx b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.15em;
  text-transform:uppercase;color:var(--green-dk)}
.minebar .tx span{display:block;font-size:13.5px;color:var(--ink);font-weight:600;
  margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine-alt{flex:none;padding:14px 13px;border-radius:10px;font-size:13px;font-weight:700;
  color:var(--green-dk);background:#fff;border:1px solid #BFDFCD;box-shadow:0 2px 0 #BFDFCD}
.mine-alt:active{box-shadow:none;transform:translateY(2px)}

.picker .panel{max-height:78vh;overflow-y:auto}
.picker h3{font-size:19px;font-family:'Bricolage Grotesque',Archivo,sans-serif;
  font-weight:800;margin:0 0 4px}
.picker .lead-in{font-size:13.5px;color:var(--grey);margin:0 0 16px;line-height:1.5}
.picker .grp{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--green-dk);margin:16px 0 8px;display:flex;align-items:center;gap:9px}
.picker .grp img{width:22px;height:22px;object-fit:contain}
.pick{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:12px 15px;margin-bottom:7px;border-radius:12px;font-size:16px;font-weight:600;
  background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.pick .box{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--line-dk);
  display:grid;place-items:center;font-size:14px;color:#fff;background:#fff}
.pick[aria-pressed="true"]{background:var(--green-lt);border-color:#BFDFCD;
  color:var(--green-dk);font-weight:700}
.pick[aria-pressed="true"] .box{background:var(--green);border-color:var(--green-dk)}
.picker .done{display:block;width:100%;padding:15px;border-radius:12px;margin-top:14px;
  background:var(--forest);color:#fff;font-size:15px;font-weight:800;
  border:1.5px solid #0F5C34;box-shadow:0 3px 0 #0F5C34}
.picker .done:active{box-shadow:0 1px 0 #0F5C34;transform:translateY(2px)}
.picker .clear{display:block;width:100%;text-align:center;padding:12px;margin-top:8px;
  font-size:13.5px;font-weight:700;color:var(--grey)}

/* ── lists: soft cards, no hard rules ───────────────────── */
main{padding:8px 16px 20px;min-height:60vh}
@keyframes swap{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
main.swap{animation:swap .19s cubic-bezier(.22,.61,.36,1)}
@media (prefers-reduced-motion:reduce){main.swap{animation:none}}
/* Day heading with a rule running off to the right, so the eye finds the
   date without it shouting. */
.dayhead{display:flex;align-items:center;gap:11px;padding:20px 2px 10px;
  font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--grey)}
.dayhead::after{content:"";flex:1;height:1px;background:var(--line-dk)}
.dayhead.soon{color:var(--green-dk)}
.dayhead.soon::after{background:#BFDFCD}
.card{background:linear-gradient(176deg,#FDFBF2 0%,#F7F3E1 45%,#E9F1EA 100%);
  border-radius:18px;padding:14px 15px;margin-bottom:9px;
  border:1px solid rgba(17,73,46,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(17,73,46,.05),
             0 6px 16px -6px rgba(17,73,46,.16);
  position:relative;overflow:hidden}
/* Crest watermark, quieter than before so it reads as paper texture. */
.card::after{content:"";position:absolute;right:-18px;bottom:-22px;width:96px;height:96px;
  background:var(--crest) no-repeat center/contain;opacity:.032;pointer-events:none}
.card.lad::after{background-image:url(crest-ladies.png)}
.card>*{position:relative;z-index:1}
/* keep the warm tone consistent everywhere a plain card appears */
.row{display:flex;gap:11px;align-items:flex-start}
.row .time{width:100%;text-align:center;border-radius:12px;
  padding:8px 3px 7px;color:var(--green-dk);
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0)),var(--green-lt);
  border:1px solid rgba(17,73,46,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(17,73,46,.06);
  font-size:16px;font-weight:800;line-height:1.05;
  font-family:'Bricolage Grotesque',Archivo,sans-serif;letter-spacing:-.025em}
.row .time em{display:block;font-style:normal;font-size:9px;font-weight:800;
  letter-spacing:.12em;margin-top:4px;opacity:.62;font-family:Archivo,Arial,sans-serif}
.card.hm .row .time{color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.02)),var(--green);
  border-color:rgba(17,73,46,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 2px 6px -2px rgba(31,130,74,.5)}
.row .mid{flex:1;min-width:0}
.row .mid .tt{font-size:16.5px;font-weight:500;line-height:1.4}
.row .mid .tt b{font-weight:700}
.row .mid .sub{font-size:13.5px;color:var(--grey);margin-top:7px;line-height:1.45}
/* Opponent badge in each row: their crest if we have one, otherwise their
   initials in the same shape, so every row balances. */
/* Both crests, in the order the teams are listed, overlapping a little the
   way a matchday graphic does. Initials stand in where there is no crest. */
/* Time then both crests in one narrow column, so the text gets the width. */
.lead{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:9px}
.duo{display:flex;flex-direction:column;align-items:center;gap:7px}
/* Last three results as W, D and L in the usual colours. Newest on the right. */
.side{display:flex;flex-direction:column;align-items:center;gap:5px}
.fdots{display:flex;gap:3px}
.fdots i{width:18px;height:18px;border-radius:50%;font-style:normal;display:grid;
  place-items:center;font-size:10.5px;font-weight:800;color:#fff;
  font-family:Archivo,Arial,sans-serif;line-height:1;
  box-shadow:0 1px 2px rgba(17,73,46,.22)}
.fdots i.W{background:#19924B}                     /* won */
.fdots i.D{background:#B87D12}                     /* drew */
.fdots i.L{background:#C7443B}                     /* lost */

.mini{width:44px;height:44px;border-radius:50%;background:#fff;flex:none;
  display:grid;place-items:center;overflow:hidden;
  border:1px solid rgba(17,73,46,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(17,73,46,.12)}
.mini.us{border-color:rgba(31,130,74,.45);z-index:2}
.mini img{width:76%;height:76%;object-fit:contain;display:block}
.mini b{font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;
  font-size:14px;color:var(--deep);letter-spacing:.01em;line-height:1}
.mini b.long{font-size:10.5px}
.card.hm .mini.us{border-color:rgba(31,130,74,.6)}

.gline{display:flex;gap:9px;align-items:flex-start;flex-wrap:nowrap}
.gline>span:last-child{flex:1;min-width:0}
.gchip{flex:none;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;letter-spacing:.05em;
  background:linear-gradient(180deg,#FFFFFF,#F1F7F3);color:var(--deep);
  border:1px solid rgba(17,73,46,.14);border-radius:8px;padding:3px 9px;
  box-shadow:0 1px 2px rgba(17,73,46,.06);line-height:1.5}
.card.hm .gchip{color:var(--green-dk);border-color:rgba(31,130,74,.28)}
.venue{display:flex;gap:8px;align-items:baseline;margin-top:6px}
.venue::before{content:"\25C6";font-size:8px;color:var(--green);opacity:.7;
  position:relative;top:-1px}

/* NEW and UPDATED flags. Inline, so they never overlap other content on a
   narrow screen the way an absolutely-positioned badge could. */
.flagbadge{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:999px;
  margin-right:8px;vertical-align:2px;color:#fff}
.flagbadge.new{background:var(--green)}
.flagbadge.upd{background:#B87D12}
/* Ticket needed - a quiet amber so it reads as information, not alarm. */
.tick{display:inline-flex;align-items:center;gap:6px;margin-top:10px;margin-right:8px;
  font-size:12.5px;font-weight:700;color:#7A5210;
  background:linear-gradient(180deg,#FFFDF6,#FBF1DC);
  border:1px solid rgba(184,125,18,.4);border-radius:999px;padding:6px 13px;
  box-shadow:0 1px 2px rgba(122,82,16,.12)}
.tick:active{box-shadow:none;transform:translateY(1px)}
.hero .tick{background:rgba(255,214,120,.18);color:#FFE7B0;
  border-color:rgba(255,214,120,.45)}
.dir{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;
  font-weight:700;color:var(--green-dk);
  background:linear-gradient(180deg,#FFFFFF,#EAF6EF);
  border:1px solid rgba(31,130,74,.26);border-radius:999px;padding:6px 13px;
  box-shadow:0 1px 2px rgba(17,73,46,.07)}
.dir:active{box-shadow:none;transform:translateY(1px)}
.bm{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 8px;
  border-radius:999px;margin-right:8px;vertical-align:1px}
.bm.men{background:var(--forest);color:#fff}
.bm.ladies{background:var(--green);color:#fff}

.card.win::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green)}
.card.loss::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line-dk)}
.card.draw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--grey-lt)}
.card.win,.card.loss,.card.draw{padding-left:19px}
.res-top{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-bottom:9px}
.obadge{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  padding:4px 11px;border-radius:999px}
.obadge.W{background:var(--green);color:#fff}
.obadge.L{background:var(--paper-2);color:var(--grey);border:1px solid var(--line-dk)}
.obadge.D{background:var(--grey-lt);color:#fff}
.sl{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:4px 0}
.sl .n{font-size:16px;font-weight:500;color:var(--grey);min-width:0;
  display:flex;align-items:center;gap:10px}
.sl .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .n .mini{width:30px;height:30px;flex:none}
.sl .n .mini b{font-size:10.5px}
.sl .n .mini b.long{font-size:9px}
.sl.w .n{color:var(--ink);font-weight:700}
.sl .s{font-size:20px;flex:none;color:var(--grey)}
.sl.w .s{color:var(--ink)}
.sl .s em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--grey-lt);
  margin-left:7px;font-family:Archivo,Arial,sans-serif;letter-spacing:0}

/* ── form guide ─────────────────────────────────────────── */
.form{display:flex;align-items:center;gap:7px;margin-top:4px}
.form .lbl{color:var(--grey-lt);font-size:10.5px}
.form i{width:23px;height:23px;border-radius:50%;font-style:normal;font-size:11.5px;
  font-weight:700;display:grid;place-items:center;color:#fff}
.form i.W{background:var(--green)}
.form i.L{background:var(--line-dk);color:var(--grey)}
.form i.D{background:var(--grey-lt)}

/* ── tables ─────────────────────────────────────────────── */
.tbl{background:linear-gradient(168deg,#FFFFFF 0%,#FFFFFF 55%,#F3FAF6 100%);
  border-radius:var(--r);margin-bottom:10px;overflow:hidden;border:1px solid #DFEBE3;
  box-shadow:0 3px 12px rgba(20,60,40,.07)}
.tbl .hd{padding:17px 18px 13px}
.tbl .hd h3{font-size:17px;line-height:1.3}
.tbl .hd .lbl{color:var(--green-dk);margin-bottom:7px;display:block}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--grey-lt);text-align:right;padding:0 3px 9px;background:var(--paper-2)}
th{padding-top:9px}
th.t,td.t{text-align:left;width:100%;padding-left:18px}
td.t{font-weight:500}
th.p,td.p{padding-right:18px}
td{padding:13px 3px;text-align:right;border-top:1px solid var(--line);color:var(--grey)}
td.t,td.p{color:var(--ink)}
td.p{font-weight:700}
tr.us td{background:var(--green-lt);color:var(--ink);font-weight:700}

/* ── record: a scoreboard of the season ─────────────────── */
.sb{background:var(--forest);color:#fff;border-radius:var(--r);padding:20px;margin-bottom:10px;
  position:relative;overflow:hidden;box-shadow:0 4px 18px rgba(26,122,72,.2)}
.sb::after{content:"";position:absolute;right:-56px;bottom:-56px;width:210px;height:210px;
  background:var(--crest) no-repeat center/contain;filter:brightness(0) invert(1);
  opacity:.08;pointer-events:none}
.sb>*{position:relative;z-index:1}
.sb .lbl{color:#DDF2E6;display:block;margin-bottom:14px}
.sb .big{display:flex;gap:10px}
.sb .big div{flex:1;background:rgba(255,255,255,.14);border-radius:var(--r-sm);
  padding:13px 8px;text-align:center}
.sb .big div.wins{background:#fff;color:var(--green-dk)}
.sb .big u{display:block;font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;
  font-size:34px;line-height:1;text-decoration:none;font-variant-numeric:tabular-nums}
.sb .big span{display:block;font-size:11px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;margin-top:6px;opacity:.85}
.sb .tot{margin-top:14px;font-size:14px;color:#DDF2E6}
.sb .tot b{color:#fff;font-weight:700}

.gr{border-radius:var(--r);padding:15px 17px;margin-bottom:9px;display:flex;
  align-items:center;gap:14px;border:1px solid #DFEBE3;
  background:linear-gradient(168deg,#FFFFFF 0%,#FFFFFF 55%,#F3FAF6 100%);
  box-shadow:0 3px 12px rgba(20,60,40,.07)}
.gr .nm{flex:1;min-width:0}
.gr .nm b{display:block;font-size:16.5px;font-weight:700}
.gr .nm span{display:block;font-size:13px;color:var(--grey);margin-top:2px}
.gr .w{flex:none;text-align:center;min-width:56px}
.gr .w u{display:block;font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;
  font-size:27px;line-height:1;text-decoration:none;color:var(--green-dk);
  font-variant-numeric:tabular-nums}
.gr .w span{display:block;font-size:10px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--grey-lt);margin-top:3px}
.gr.none .w u{color:var(--line-dk)}
.bhead{display:flex;align-items:center;gap:11px;padding:20px 4px 12px}
.bhead img{width:34px;height:34px;object-fit:contain}
.hint{margin:14px 4px 4px;font-size:13.5px;color:var(--grey);line-height:1.5;
  background:var(--green-lt);border-radius:var(--r-sm);padding:12px 14px}
.bhead b{font-size:19px;font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800}

/* ── record: expandable analysis ────────────────────────── */
.gr{cursor:pointer}
.gr .go{flex:none;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--green-dk);
  background:var(--green-lt);border-radius:999px;padding:6px 11px 6px 12px;white-space:nowrap}
.gr .go em{font-style:normal;font-size:14px;line-height:1;transition:transform .15s;display:block}
.gr[aria-expanded="true"] .go{background:var(--forest);color:#fff}
.gr[aria-expanded="true"] .go em{transform:rotate(90deg)}
.gr:active{transform:translateY(1px)}
.gr[aria-expanded="true"]{border-bottom-left-radius:0;border-bottom-right-radius:0;
  margin-bottom:0;box-shadow:0 -2px 10px rgba(20,60,40,.05)}
.an{background:var(--paper);border-radius:0 0 var(--r) var(--r);padding:2px 17px 18px;
  margin-bottom:9px;box-shadow:0 2px 10px rgba(20,60,40,.05)}
.ktabs{display:flex;gap:8px;padding:14px 0 4px}
.ktabs button{flex:1;padding:14px 8px;border-radius:11px;font-size:13.5px;font-weight:700;
  background:var(--green-lt);color:var(--green-dk);border:1.5px solid #BFDFCD;
  box-shadow:0 3px 0 #BFDFCD;transform:translateY(-1px)}
.ktabs button:active{box-shadow:0 1px 0 #BFDFCD;transform:translateY(1px)}
.ktabs button[aria-pressed="true"]{background:var(--forest);color:#fff;border-color:#0F5C34;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.28);transform:translateY(1px)}
.konly{padding:14px 0 2px;font-size:12.5px;font-weight:600;color:var(--grey-lt)}
.an .form{margin:14px 0 0}
.an .rate{display:flex;align-items:center;gap:13px;padding:14px 0 16px;
  border-top:1px solid var(--line)}
.an .rate u{font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;
  font-size:31px;text-decoration:none;line-height:1;color:var(--green-dk);
  font-variant-numeric:tabular-nums}
.an .rate u i{font-style:normal;font-size:15px;color:var(--grey-lt);font-weight:700}
.an .rate .bar{flex:1;height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.an .rate .bar span{display:block;height:100%;background:var(--green);border-radius:999px}
.an .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}
.an .cell{background:var(--paper-2);border-radius:var(--r-sm);padding:11px 13px}
.an .cell b{display:block;font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;
  font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.an .cell span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--grey-lt);margin-top:4px}
.an h4{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--green-dk);margin:0 0 8px}
.an p{margin:0 0 15px;font-size:14.5px;line-height:1.6;color:var(--ink)}
.an .note{font-size:12.5px;color:var(--grey-lt);line-height:1.55;margin:0}
.an .standing{font-size:14px;color:var(--grey);line-height:1.6;margin:0 0 15px}
.an .standing b{color:var(--ink)}
.an .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;
  border-radius:999px;background:var(--green-lt);color:var(--green-dk);margin:0 6px 6px 0}
.an .pill.bad{background:#F3EEE6;color:#7A5A22}

/* ── news ───────────────────────────────────────────────── */
.sec{padding:20px 4px 10px}
.sec h2{font-size:20px}
.sec .lbl{color:var(--green-dk);display:block;margin-bottom:8px}
.sec p{margin:8px 0 0;font-size:14px;color:var(--grey);line-height:1.55}
.story{display:block;border-radius:var(--r);padding:16px 18px;margin-bottom:9px;
  background:linear-gradient(168deg,#FFFFFF 0%,#FFFFFF 55%,#F3FAF6 100%);
  border:1px solid #DFEBE3;box-shadow:0 3px 12px rgba(20,60,40,.07)}
.story h3{font-size:17px;font-weight:600;line-height:1.45}
.story.lead h3{font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.025em;
  font-family:'Bricolage Grotesque',Archivo,Arial,sans-serif}
.story .by{margin-top:10px;font-size:12.5px;color:var(--grey);font-weight:600}
.story .by b{color:var(--green-dk);font-weight:700}
.story .by s{text-decoration:none;color:var(--grey-lt)}
.paid .story{background:#EFF3F0;box-shadow:none}

/* ── alerts + club ──────────────────────────────────────── */
.panel{background:linear-gradient(168deg,#FFFFFF 0%,#FFFFFF 55%,#F3FAF6 100%);
  border-radius:var(--r);padding:20px;margin-bottom:10px;border:1px solid #DFEBE3;
  box-shadow:0 3px 12px rgba(20,60,40,.07)}
.panel .lbl{color:var(--green-dk);display:block;margin-bottom:9px}
.panel h2{font-size:20px;margin-bottom:9px}
.panel p{margin:0 0 16px;font-size:14.5px;color:var(--grey);line-height:1.6}
.panel p b{color:var(--ink);font-weight:600}
.btn{display:block;background:var(--forest);color:#fff;text-align:center;padding:16px;
  font-size:15px;font-weight:700;border-radius:12px;margin-bottom:11px;
  border:1.5px solid #0F5C34;box-shadow:0 3px 0 #0F5C34}
.btn:active{box-shadow:0 1px 0 #0F5C34;transform:translateY(2px)}
.btn.alt{background:var(--green-lt);color:var(--green-dk);border-color:#BFDFCD;
  box-shadow:0 3px 0 #BFDFCD}
.btn.alt:active{box-shadow:0 1px 0 #BFDFCD}
.fine{font-size:13px;color:var(--grey-lt);line-height:1.6;margin:14px 0 0}
.act{display:flex;align-items:center;gap:15px;border-radius:var(--r);
  background:linear-gradient(168deg,#FFFFFF 0%,#FFFFFF 55%,#F3FAF6 100%);
  padding:16px 18px;margin-bottom:9px;border:1px solid #DFEBE3;
  box-shadow:0 3px 12px rgba(20,60,40,.07)}
.act{position:relative;overflow:hidden}
.act::after{content:"";position:absolute;right:-26px;bottom:-30px;width:110px;height:110px;
  background:var(--crest) no-repeat center/contain;opacity:.045;pointer-events:none}
.act>*{position:relative;z-index:1}
.act .ic{width:44px;height:44px;flex:none;border-radius:12px;background:var(--green-lt);
  border:1px solid #CFE6D9;display:grid;place-items:center;font-size:17px;font-weight:800;
  color:var(--green-dk);font-family:'Bricolage Grotesque',Archivo,sans-serif}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-size:16.5px;font-weight:700}
.act .tx span{display:block;font-size:13.5px;color:var(--grey);margin-top:2px;line-height:1.4}
.act .go{flex:none;font-size:19px;color:var(--green)}

/* ── club sub-nav and media ─────────────────────────────── */
.mgroup{display:flex;align-items:center;gap:11px;padding:20px 2px 10px}
.mgroup .lbl{color:var(--green-dk);flex:none}
.mgroup::after{content:"";flex:1;height:1px;background:#BFDFCD}
/* One card per section with hairline rows, rather than a floating card per
   link. Far less white space and much quicker to scan. */
.mlist{background:linear-gradient(168deg,#FFFFFF 0%,#FFFFFF 55%,#F3FAF6 100%);
  border-radius:var(--r);overflow:hidden;border:1px solid #DFEBE3;
  box-shadow:0 3px 12px rgba(20,60,40,.07);position:relative}
.mlist::after{content:"";position:absolute;right:-26px;bottom:-30px;width:118px;height:118px;
  background:var(--crest) no-repeat center/contain;opacity:.045;pointer-events:none}
.mlist .mrow{position:relative;z-index:1}
.mrow{display:flex;align-items:center;gap:12px;padding:13px 15px;
  border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .ic{width:34px;height:34px;flex:none;border-radius:10px;background:var(--green-lt);
  border:1px solid #CFE6D9;display:grid;place-items:center;font-size:13.5px;
  color:var(--green-dk)}
.mrow:active{background:rgba(35,166,90,.06)}
.mrow .tx{flex:1;min-width:0}
.mrow .tx b{display:block;font-size:15.5px;font-weight:700;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .tx span{display:block;font-size:12.5px;color:var(--grey);margin-top:1px;
  line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .go{flex:none;font-size:15px;color:var(--grey-lt)}
.mrow.wrap2 .tx b{white-space:normal}
.clubfacts{border-radius:var(--r);padding:18px;margin-bottom:9px;border:1px solid #DFEBE3;
  background:linear-gradient(168deg,#FFFFFF 0%,#FFFFFF 55%,#F3FAF6 100%);
  box-shadow:0 3px 12px rgba(20,60,40,.07)}
.clubfacts dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px}
.clubfacts dt{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--grey-lt);padding-top:2px;white-space:nowrap}
.clubfacts dd{margin:0;font-size:15px;font-weight:600}
.clubfacts h4{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--green-dk);margin:18px 0 9px}
.clubfacts ul{margin:0;padding:0;list-style:none}
.clubfacts li{font-size:14.5px;line-height:1.5;padding:8px 0 8px 20px;position:relative;
  border-top:1px solid var(--line)}
.clubfacts li::before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;
  border-radius:50%;background:var(--green)}

/* ── feature rows: shop, tickets ────────────────────────── */
/* A proper invitation rather than another list row: a green tile carrying
   the icon, a heavier title, and both crests waiting underneath. */
.feat{display:flex;align-items:center;gap:15px;padding:16px 17px;margin-bottom:10px;
  border-radius:20px;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(158deg,#FFFFFF 0%,#FFFFFF 48%,#EDF8F1 100%);
  border:1px solid rgba(31,130,74,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 5px 18px -7px rgba(17,73,46,.28)}
.feat::after{content:"";position:absolute;right:-30px;top:-34px;width:132px;height:132px;
  border-radius:50%;background:radial-gradient(circle,rgba(58,205,119,.16),transparent 68%);
  pointer-events:none}
.feat .tile{width:52px;height:52px;flex:none;border-radius:15px;display:grid;
  place-items:center;position:relative;z-index:1;
  background:linear-gradient(160deg,var(--green),var(--green-dk));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 4px 10px -3px rgba(31,130,74,.6)}
.feat .tile svg{width:25px;height:25px;stroke:#fff;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.feat .tx{flex:1;min-width:0;position:relative;z-index:1}
.feat .tx b{display:block;font-size:17.5px;font-weight:800;line-height:1.25;
  font-family:'Bricolage Grotesque',Archivo,sans-serif;letter-spacing:-.01em}
.feat .tx span{display:block;font-size:13px;color:var(--grey);margin-top:3px;line-height:1.4}
.feat .go{flex:none;position:relative;z-index:1;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;background:var(--green-lt);color:var(--green-dk);
  font-size:15px;font-weight:800;transition:transform .16s}
.feat[aria-expanded="true"]{margin-bottom:0;border-bottom-left-radius:0;
  border-bottom-right-radius:0}
.feat[aria-expanded="true"] .go{transform:rotate(90deg);background:var(--forest);color:#fff}
.feat:active{transform:translateY(1px)}

.branches{background:linear-gradient(180deg,#F4FBF7,#EAF6EF);
  border:1px solid rgba(31,130,74,.22);border-top:0;border-radius:0 0 20px 20px;
  margin-bottom:10px;overflow:hidden;box-shadow:0 5px 18px -7px rgba(17,73,46,.24)}
.blink{display:flex;align-items:center;gap:14px;padding:14px 17px;
  border-top:1px solid rgba(31,130,74,.14)}
.blink .mini{width:42px;height:42px}
.blink .tx{flex:1;min-width:0}
.blink .tx b{display:block;font-size:16px;font-weight:700}
.blink .tx span{display:block;font-size:12.5px;color:var(--grey);margin-top:2px}
.blink .go{flex:none;font-size:17px;color:var(--green-dk)}
.blink:active{background:rgba(58,205,119,.1)}

/* ── head to head ───────────────────────────────────────── */
.tt .who{border-bottom:1.5px dotted rgba(17,73,46,.35);cursor:pointer}
.card[aria-expanded="true"] .tt .who{border-bottom-style:solid;color:var(--green-dk)}
.h2h{margin-top:13px;padding-top:13px;border-top:1px solid rgba(17,73,46,.12)}
.h2h .comp{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--green-dk);margin-bottom:9px}
.h2h table{width:100%;border-collapse:collapse;font-size:13px}
.h2h th{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--grey-lt);text-align:right;padding:0 3px 6px;background:none}
.h2h th.t,.h2h td.t{text-align:left;width:100%;padding-left:0}
.h2h td{padding:7px 3px;text-align:right;border-top:1px solid rgba(17,73,46,.08);
  color:var(--grey);font-variant-numeric:tabular-nums}
.h2h td.t{color:var(--ink);font-weight:600}
.h2h tr.us td{color:var(--ink);font-weight:800}
.h2h tr.us td.t{color:var(--green-dk)}
.h2h .pos{display:inline-block;min-width:20px;font-size:11px;color:var(--grey-lt);
  font-weight:700;margin-right:8px}
.h2h .say{margin:11px 0 0;font-size:13px;line-height:1.55;color:var(--ink)}
.h2h .past{margin:9px 0 0;font-size:12.5px;color:var(--grey);line-height:1.5}
.h2h .past b{color:var(--ink)}
.h2h .none{margin:0;font-size:12.5px;color:var(--grey-lt)}

/* ── footer ─────────────────────────────────────────────── */
.foot{background:var(--forest);color:#DDF2E6;margin:10px 0 0;
  padding:26px 20px calc(30px + env(safe-area-inset-bottom));
  border-radius:26px 26px 0 0;font-size:13px;line-height:1.75;
  display:flex;gap:16px;align-items:flex-start}
.foot img{width:46px;height:46px;object-fit:contain;flex:none;
  filter:brightness(0) invert(1);opacity:.7}
.foot a,.foot b{color:#fff;font-weight:600}
.count{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);
  border-radius:999px;padding:4px 12px;margin-top:9px;font-size:12.5px;font-weight:600;color:#fff}
.count{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);
  border-radius:999px;padding:5px 13px;margin-top:9px;font-size:12.5px;font-weight:600;color:#fff}
.count[hidden]{display:none}
.count img{height:19px;display:block;border-radius:4px}
.empty{padding:46px 26px 54px;text-align:center;color:var(--grey)}
.empty img{width:58px;height:58px;object-fit:contain;opacity:.2;margin:0 auto 16px;display:block}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:7px;
  font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800}
.empty span{font-size:14.5px;line-height:1.55;display:block;max-width:290px;margin:0 auto}
.clear-filter{margin-top:18px;padding:13px 22px;border-radius:12px;font-size:14.5px;
  font-weight:800;background:var(--forest);color:#fff;border:1.5px solid #0F5C34;
  box-shadow:0 3px 0 #0F5C34}
.clear-filter:active{box-shadow:0 1px 0 #0F5C34;transform:translateY(2px)}
@media (min-width:620px){
  body{max-width:600px;margin:0 auto}
  .vs .side b{font-size:31px}
}
