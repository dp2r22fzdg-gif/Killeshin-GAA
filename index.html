|championship":["W","W","W"],"timahoe|ladies|Minor|championship":["W","L","L"],"timahoe|ladies|U14|league":["L","L","L"],"timahoe|ladies|U16|league":["W","L"],"mountrath|ladies|Minor|championship":["L","L","L"],"mountrath|ladies|U14|championship":["L","W","W"],"mountrath|ladies|U16|championship":["L","W","W"],"mountrath|ladies|U14|league":["D","W","L"],"mountrath|ladies|U16|league":["L","W","D"]},"promo":{"show":true,"tag":"Last One Standing","title":"Who is still in?","note":"2 of 856 still in · Gameweek 7","url":"https://www.oneshotclub.ie/killeshin-gaa/killeshin-gaa-last-man-standing/selections-tracker"},"teamFeeds":{"men|U20":"men-u20"}}</script>
<script>
(function(){
"use strict";

var DATA;
try { DATA = JSON.parse(document.getElementById('seed').textContent); }
catch(err){
  console.error('built-in data unreadable', err);
  DATA = {fixtures:[],results:[],tables:[],news:[],branches:{},gradesBy:{},ground:''};
}

/* Both is the landing view - most people want the whole parish, not one branch. */
var branch = 'all', grade = 'All', homeOnly = false, view = 'fixtures';
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAY = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function d(s){ var p=s.split('-'); return new Date(+p[0], p[1]-1, +p[2]); }
function longDate(s){ var x=d(s); return DAY[x.getDay()]+' '+x.getDate()+' '+MON[x.getMonth()]; }
function shortDate(s){ var x=d(s); return DAY[x.getDay()].slice(0,3)+' '+x.getDate()+' '+MON[x.getMonth()]; }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function daysAway(s){ var t=new Date(); t.setHours(0,0,0,0); return Math.round((d(s)-t)/86400000); }
function br(b){ var B = DATA.branches || {}; return B[b] || B.men ||
  {name:"Men", team:'Gleann Uiseann', crest:'crest.png', source:'#'}; }
function ourName(b){ return br(b).team; }
function label(n,b){ return n===ourName(b) ? 'Killeshin' : n; }
/* Killeshin listed first means we are hosting, even before the county board
   fills in the ground - most ladies fixtures sit as TBC until days out. */
function atHome(m){
  var v = m.venue || '';
  if(v.indexOf('Killeshin') > -1) return true;
  return !!m.isHome && (v === 'TBC' || v === '');
}
function flagBadge(m){
  if(m.isNew) return '<span class="flagbadge new">New</span>';
  if(m.isUpdated) return '<span class="flagbadge upd">Updated</span>';
  return '';
}
/* Shown once the county board has actually named someone - "TBC" is not
   worth a line, it is the same as saying nothing. */
function metaLine(f){
  var bits = [venueOf(f)];
  if(f.referee && f.referee !== 'TBC') bits.push('Ref: ' + f.referee);
  return '<span class="venue"><span>' + bits.map(esc).join(' \u00b7 ') + '</span></span>';
}

function venueOf(m){
  var v = m.venue || 'TBC';
  return (v === 'TBC' && m.isHome) ? (DATA.ground || 'Killeshin') + ' (to be confirmed)' : v;
}
/* A match stays up while it is being played, then drops off about two hours
   after throw-in. Comparing dates alone left this morning's game sitting
   there as "next match" until midnight. */
function startOf(m){
  var p = m.date.split('-');
  var t = /^\d{1,2}:\d{2}$/.test(m.time) ? m.time.split(':') : ['23','59'];
  return new Date(+p[0], p[1]-1, +p[2], +t[0], +t[1]).getTime();
}
/* Once throw-in passes, that game is no longer "next" - move straight on. */
function stillOn(m){ return Date.now() < startOf(m); }
/* The county boards publish men's and ladies' fixtures as two separate
   blocks, so on the All branch they naturally run men-then-ladies, not by
   date. Sorted here, once, by the actual kick-off time (not just the date)
   so a fixture is always next to whatever else is happening around it in
   time - this also fixes which game the hero panel picks as "next match"
   when All is selected, not just the list order. */
function upcoming(){
  return DATA.fixtures.filter(stillOn).sort(function(a, b){ return startOf(a) - startOf(b); });
}
function mixed(){ return branch === 'all'; }
function crestOf(b){ return br(b).crest; }

/* Directions: a maps search by venue name is more reliable than storing
   coordinates for thirty grounds, and opens the phone's own maps app. */
function mapUrl(venue){
  if(!venue || venue === 'TBC') return null;
  var q = venue.indexOf('Ireland') > -1 ? venue : venue + ', Ireland';
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}
/* Only on away games - nobody needs directions to their own pitch. */
/* A ticket link where one is needed, straight to the county board's page. */
function ticketPill(m){
  if(!m.ticket) return '';
  return '<a class="tick" href="' + esc(m.ticket) + '" target="_blank" rel="noopener">' +
         '\u25AF Tickets</a>';
}
function directions(match){
  if(atHome(match)) return '';
  var u = mapUrl(match.venue);
  if(!u) return '';
  return '<a class="dir" href="'+u+'" target="_blank" rel="noopener">\u2192 Directions</a>';
}

function pick(list){
  return list.filter(function(m){
    if(grade === '__mine'){
      if(!isMine(m)) return false;            /* spans both branches by design */
    } else {
      if(branch !== 'all' && m.branch !== branch) return false;
      if(grade !== 'All' && m.grade !== grade) return false;
    }
    if(homeOnly && !atHome(m)) return false;
    return true;
  });
}
function mark(m){
  return mixed() ? '<span class="bm '+m.branch+'">'+(m.branch==='men'?"MEN":'LADIES')+'</span>' : '';
}

/* ---- form guide: last five for a branch and grade ---- */
function formFor(b, g){
  var list = DATA.results.filter(function(r){
    return r.branch === b && (!g || r.grade === g); });
  return list.slice(0, 5).reverse();          /* results are newest first */
}
function formStrip(b, g, label_){
  var f = formFor(b, g);
  if(f.length < 2) return '';
  return '<div class="form"><span class="lbl">'+esc(label_ || 'Form')+'</span>' +
    f.map(function(r){ return '<i class="'+r.outcome+'">'+r.outcome+'</i>'; }).join('') + '</div>';
}

/* ---- hero ---- */
var MICON = {
  cal:   '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  pin:   '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>',
  shirt: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3l4 2 4-2 5 3-2.5 4L17 9v12H7V9l-1.5 1L3 6z"/></svg>'
};
/* Their crest if the board has one, otherwise their initials. */
function initials(name){
  var clean = String(name || '').replace(/\b(GAA|CLG|Club|Gaels|Parish)\b/gi,' ').trim();
  var words = clean.split(/\s+/).filter(Boolean);
  if(words.length === 1) return words[0].slice(0,3).toUpperCase();   /* BAL, POR */
  return words.slice(0,3).map(function(w){ return w.charAt(0).toUpperCase(); }).join('');
}
function monoHtml(name, id){
  var t = initials(name);
  return '<span class="mono' + (t.length > 2 ? ' long' : '') + '" id="' + id + '">' +
         '<span>' + esc(t) + '</span></span>';
}
function oppCrest(name, id){
  var url = (DATA.crests || {})[name];
  if(!url) return monoHtml(name, id);
  /* If the crest fails to load, fall back to the badge rather than a gap. */
  return '<span class="crest" id="'+id+'"><img src="'+esc(url)+'" width="72" height="72" alt="" ' +
    'onerror="this.parentNode.outerHTML=' +
    esc(JSON.stringify(monoHtml(name, id))).replace(/"/g,'&quot;') + '"></span>';
}

function oneBadge(html, cls){
  return '<span class="mini' + (cls ? ' ' + cls : '') + '">' + html + '</span>';
}
/* Last three results, oldest to newest. Shows fewer if fewer have been played,
   and nothing at all if the board has published none. */
function formDots(name, branch, grade, kind){
  var key = looseKey(name) + '|' + branch + '|' + grade + '|' + kind;
  var f = (DATA.form || {})[key];
  if(!f || !f.length) return '';
  return '<span class="fdots">' + f.slice(0, 3).reverse().map(function(o){
    var word = o === 'W' ? 'Won' : o === 'L' ? 'Lost' : 'Drew';
    return '<i class="' + o + '" title="' + word + '">' + o + '</i>'; }).join('') + '</span>';
}
function side(badge, name, m, withForm){
  return '<span class="side">' + badge +
    (withForm ? formDots(name, m.branch, m.grade, compKind(m.competition)) : '') +
    '</span>';
}
function clubBadge(branch){
  return oneBadge('<img src="' + esc(crestOf(branch)) + '" width="72" height="72" loading="lazy" alt="">', 'us');
}
function rivalBadge(name){
  var url = (DATA.crests || {})[name];
  var t = initials(name);
  var fallback = '<b class="' + (t.length > 2 ? 'long' : '') + '">' + esc(t) + '</b>';
  var inner = url
    ? '<img src="' + esc(url) + '" width="72" height="72" loading="lazy" alt="" onerror="this.outerHTML=' +
      esc(JSON.stringify(fallback)).replace(/"/g,'&quot;') + '">'
    : fallback;
  return oneBadge(inner);
}
/* Form shows on fixtures only - on a result the score already tells you. */
function badgePair(m, withForm){
  var us = ourName(m.branch);
  return '<span class="duo">' +
    (m.home === us
      ? side(clubBadge(m.branch), us, m, withForm) + side(rivalBadge(m.away), m.away, m, withForm)
      : side(rivalBadge(m.home), m.home, m, withForm) + side(clubBadge(m.branch), us, m, withForm)) +
    '</span>';
}

function metaCell(icon, top, sub){
  return '<div class="m">' + MICON[icon] + '<div><b>' + top + '</b>' +
         (sub ? '<span>' + sub + '</span>' : '') + '</div></div>';
}

function renderNext(){
  var hero = document.getElementById('hero');
  var pool = pick(upcoming());          /* respects branch, grade and home only */

  if(!pool.length){ hero.hidden = true; } else {
    var f = pool[0], n = daysAway(f.date);
    hero.hidden = false;
    hero.style.setProperty('--crest', 'url(' + crestOf(f.branch) + ')');

    document.getElementById('heroLbl').textContent =
      mixed() ? (f.branch==='men' ? 'Next match \u00b7 Men' : 'Next match \u00b7 Ladies')
              : 'Next match';

    var mins = Math.round((startOf(f) - Date.now()) / 60000);
    document.getElementById('heroCd').innerHTML = MICON.cal + '<span>' +
      esc(mins <= 60 ? (mins <= 1 ? 'Starting now' : 'In ' + mins + ' min')
        : n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : 'In ' + n + ' days') + '</span>';

    document.getElementById('heroCrest').src = crestOf(f.branch);
    document.getElementById('heroOpp').textContent = label(f.opponent, f.branch);
    document.getElementById('heroOppCrest').outerHTML = oppCrest(f.opponent, 'heroOppCrest');
    document.getElementById('heroComp').textContent = f.competition;

    var timed = /^\d{1,2}:\d{2}$/.test(f.time);
    var venue = venueOf(f);
    document.getElementById('heroMeta').innerHTML =
      metaCell('cal', esc(shortDate(f.date)), timed ? esc(f.time) : 'Time TBC') +
      metaCell('pin', esc(venue.split(' (')[0]),
               atHome(f) ? 'At home' : 'Away' ) +
      metaCell('shirt', esc(f.grade), '');

    /* The referee's name needs room to read properly - squeezed into a
       third of the meta row, alongside the grade, a longer name wrapped
       awkwardly. It gets its own full-width line instead. */
    var refBox = document.getElementById('heroRef');
    if(f.referee && f.referee !== 'TBC'){
      refBox.hidden = false;
      refBox.innerHTML = MICON.shirt + '<span>Referee: ' + esc(f.referee) + '</span>';
    } else {
      refBox.hidden = true;
    }

    var mu = atHome(f) ? null : mapUrl(f.venue);
    document.getElementById('heroDir').innerHTML = ticketPill(f) + (mu
      ? '<a class="dir" href="' + mu + '" target="_blank" rel="noopener">\u2192 Directions</a>'
      : '');

    weather(f, document.getElementById('heroWx'), true);
  }

  var hm = pick(upcoming()).filter(function(f){
    return atHome(f) && f !== pool[0]; })[0];
  var box = document.getElementById('athome');
  if(!hm){ box.hidden = true; return; }
  box.hidden = false;
  document.getElementById('ahCrest').src = crestOf(hm.branch);
  document.getElementById('ahLine').textContent =
    (mixed() ? (hm.branch==='men' ? 'Men ' : 'Ladies ') : '') +
    hm.grade + '  v  ' + label(hm.opponent, hm.branch);
  document.getElementById('ahSub').innerHTML =
    MICON.cal + '<span>' + esc(shortDate(hm.date) + '  \u00b7  ' + hm.time + '  \u00b7  ' +
    venueOf(hm)) + '</span>';
  weather(hm, document.getElementById('ahWx'), false);
}

/* ---- weather: Killeshin, from the free open-meteo service ---- */
var WX = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',
  66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',
  80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorms',96:'Thunderstorms',
  99:'Thunderstorms'};
function weather(match, el, big){
  if(!el) return;
  var n = daysAway(match.date);
  var timed = /^\d{1,2}:\d{2}$/.test(match.time);

  if(n < 0 || !timed){ el.hidden = true; return; }
  if(n > 14){                                   /* forecasts do not reach that far */
    if(!big){ el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = '<span class="ico">\u2601</span><span class="soft">' +
      'Forecast appears about two weeks out.</span>';
    return;
  }

  el.hidden = false;
  el.innerHTML = big
    ? '<span class="ico">\u2601</span><span class="soft">Checking the forecast\u2026</span>'
    : '<span class="soft">Checking the forecast\u2026</span>';

  var when = match.date + 'T' + (match.time.length === 4 ? '0' : '') + match.time;
  var want = when.slice(0, 13) + ':00';

  fetch('https://api.open-meteo.com/v1/forecast?latitude=52.85&longitude=-7.02' +
        '&hourly=temperature_2m,precipitation_probability,weather_code' +
        '&timezone=Europe%2FDublin&forecast_days=16')
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      var i = j.hourly.time.indexOf(want);
      if(i < 0) throw 0;
      var t = Math.round(j.hourly.temperature_2m[i]);
      var rain = j.hourly.precipitation_probability[i];
      var sky = WX[j.hourly.weather_code[i]] || 'Forecast';
      var line = sky + ' \u00b7 ' + t + '\u00b0C \u00b7 ' + rain + '% chance of rain';
      if(big){
        el.innerHTML = '<span class="ico">' + icon(j.hourly.weather_code[i]) + '</span>' +
          '<span><b>At throw-in</b><span class="soft">' + esc(line) + '</span></span>';
      } else {
        el.textContent = icon(j.hourly.weather_code[i]) + '  ' + line;
      }
    })
    .catch(function(){
      /* No forecast is better than a wrong one - say so rather than guess. */
      if(big){ el.innerHTML = '<span class="ico">\u2601</span>' +
        '<span class="soft">Forecast not available right now.</span>'; }
      else { el.hidden = true; }
    });
}
function icon(code){
  if(code === 0 || code === 1) return '\u2600';
  if(code === 2) return '\u26C5';
  if(code === 3 || code === 45 || code === 48) return '\u2601';
  if(code >= 71 && code <= 77) return '\u2744';
  if(code >= 95) return '\u26C8';
  if(code >= 51) return '\u2614';
  return '\u2601';
}

/* ---- fixtures ---- */
function renderFixtures(){
  var list = pick(upcoming());

  /* The next match already has the panel above, so leave it out of the list
     rather than showing the same game twice. */
  var hero = document.getElementById('hero');
  var shown = hero && !hero.hidden && view === 'fixtures';
  var only = shown && list.length === 1;
  if(shown && list.length) list = list.slice(1);

  if(!list.length){
    return only
      ? '<div class="empty"><img src="' + crestOf(branch==='ladies'?'ladies':'men') + '" width="72" height="72" loading="lazy" alt="">' +
        '<b>That is the lot for now</b><span>The game above is the only one down. ' +
        'New fixtures appear within an hour of the county board publishing them.</span></div>'
      : empty('Nothing down yet', emptyWhy('fixtures'));
  }
  var html='', day=null;
  list.forEach(function(f){
    if(f.date!==day){
      day=f.date; var n=daysAway(f.date);
      html += '<div class="dayhead'+(n<=2?' soon':'')+'">' + esc(longDate(f.date)) +
              (n===0?' \u2014 today':n===1?' \u2014 tomorrow':'') + '</div>';
    }
    var timed = /^\d{1,2}:\d{2}$/.test(f.time);
    html += '<div class="card'+(atHome(f)?' hm':'')+(f.branch==="ladies"?' lad':'')+'"><div class="row">' +
      '<div class="lead"><div class="time num">' + (timed ? esc(f.time) : 'TBC') +
        '<em>' + (atHome(f) ? 'HOME' : 'AWAY') + '</em></div>' +
      badgePair(f, true) + '</div>' +
      '<div class="mid">' +
      '<div class="tt">'+flagBadge(f)+mark(f)+teamLine(f)+'</div>' +
      '<div class="sub">' +
        '<span class="gline"><span class="gchip">'+esc(f.grade)+'</span>' +
        '<span>'+esc(f.competition)+'</span></span>' +
        metaLine(f) +
      '</div>' + ticketPill(f) + directions(f) +
      '</div></div></div>';
  });
  return html;
}
function teamLine(m){
  var us = ourName(m.branch), H = m.home === us, A = m.away === us;
  return (H?'<b>':'')+esc(label(m.home,m.branch))+(H?'</b>':'') + ' v ' +
         (A?'<b>':'')+esc(label(m.away,m.branch))+(A?'</b>':'');
}

/* ---- results ---- */
/* Opponent and year, on top of the branch/grade/home filters everything else
   already uses. Session-only - a stale search silently hiding next season's
   results would be far more confusing than having to type it again. */
var searchText = '', yearFilter = 'All';

function resultYears(){
  var set = {};
  DATA.results.forEach(function(r){ set[r.date.slice(0, 4)] = 1; });
  return ['All'].concat(Object.keys(set).sort().reverse());
}
function matchesSearch(r){
  if(yearFilter !== 'All' && r.date.slice(0, 4) !== yearFilter) return false;
  if(searchText && r.opponent.toLowerCase().indexOf(searchText.toLowerCase()) === -1) return false;
  return true;
}

function renderResults(){
  var list = pick(DATA.results).filter(matchesSearch);
  if(!list.length){
    return (searchText || yearFilter !== 'All')
      ? empty('No matches', 'Nothing found' +
          (searchText ? ' for \u201c' + searchText + '\u201d' : '') +
          (yearFilter !== 'All' ? ' in ' + yearFilter : '') + '.')
      : empty('No results yet', emptyWhy('results'));
  }
  var html = '';
  if(branch !== 'all'){
    var f = formStrip(branch, grade === 'All' ? null : grade, 'Last 5');
    if(f) html += '<div class="card">' + f + '</div>';
  }
  var day=null;
  list.forEach(function(r){
    if(r.date!==day){ day=r.date; html += '<div class="dayhead">'+esc(longDate(r.date))+'</div>'; }
    var cls = r.outcome==='W' ? ' win' : r.outcome==='L' ? ' loss' : ' draw';
    var word = r.outcome==='W' ? 'Won' : r.outcome==='L' ? 'Lost' : 'Drew';
    var place = (r.venue && r.venue !== 'TBC') ? r.venue : '';
    html += '<div class="card'+cls+(r.branch==="ladies"?' lad':'')+'">' +
      '<div class="res-top">' +
        '<span>' + (r.isNew ? '<span class="flagbadge new">New</span>' : '') +
        mark(r) + '<span class="gchip">'+esc(r.grade)+'</span></span>' +
        '<span class="obadge '+r.outcome+'">'+word+'</span>' +
      '</div>' +
      scoreLine(r, r.home, r.homeScore, r.homeTotal, r.homeTotal>r.awayTotal) +
      scoreLine(r, r.away, r.awayScore, r.awayTotal, r.awayTotal>r.homeTotal) +
      '<div class="sub" style="font-size:13.5px;color:var(--grey);margin-top:10px">' +
      esc(r.competition) +
      (place ? '<span class="venue"><span>'+esc(place)+'</span></span>' : '') +
      '</div></div>';
  });
  return html;
}
function scoreLine(m,n,sc,tot,won){
  var us = ourName(m.branch);
  var badge = (n === us) ? clubBadge(m.branch) : rivalBadge(n);
  return '<div class="sl'+(won?' w':'')+'">' +
         '<div class="n">' + badge + '<span>' + esc(label(n, m.branch)) + '</span></div>' +
         '<div class="s dsp num">'+esc(sc)+'<em>'+tot+'</em></div></div>';
}

/* ---- tables ---- */
function renderTables(){
  var list = DATA.tables.filter(function(t){
    if(branch !== 'all' && t.branch !== branch) return false;
    return grade === 'All' || t.grade === grade;
  });
  if(!list.length) return empty('No table here',
    'Knockout and championship groups do not always run a league table.');
  return list.map(function(t){
    var us = ourName(t.branch);
    var rows = t.rows.map(function(r,i){
      return '<tr'+(r.team===us?' class="us"':'')+'><td class="t">' +
        '<span class="num" style="color:var(--grey-lt);margin-right:11px">'+(i+1)+'</span>' +
        esc(label(r.team,t.branch))+'</td><td class="num">'+r.p+'</td><td class="num">'+r.w+'</td>' +
        '<td class="num">'+r.d+'</td><td class="num">'+r.l+'</td><td class="num">'+r.f+'</td>' +
        '<td class="num">'+r.a+'</td><td class="p num">'+r.pts+'</td></tr>';
    }).join('');
    return '<section class="tbl"><div class="hd"><span class="lbl">' +
      (mixed() ? (t.branch==='men'?"Men \u00b7 ":'Ladies \u00b7 ') : '') + esc(t.grade) + '</span>' +
      '<h3 class="dsp">'+esc(t.competition)+'</h3>' + formStrip(t.branch, t.grade) + '</div>' +
      '<table><thead><tr><th class="t">Team</th><th>P</th><th>W</th><th>D</th><th>L</th>' +
      '<th>F</th><th>A</th><th class="p">Pts</th></tr></thead><tbody>'+rows+'</tbody></table></section>';
  }).join('');
}

/* ---- record: wins by age group, adult down to U12 ---- */
/* The county board's league tables are the complete record - the team page
   only lists recent matches, so counting those alone badly undercounts.
   Tables first, then any knockout competition that has no table. */
function normComp(x){ return String(x||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

function tally(b){
  var by = {}, tabs = [];
  function bucket(g){
    return by[g] || (by[g] = {p:0,W:0,D:0,L:0,f:0,a:0}); }

  DATA.tables.forEach(function(t){
    if(t.branch !== b) return;
    var us = ourName(b);
    var row = null;
    for(var i=0;i<t.rows.length;i++) if(t.rows[i].team === us) row = t.rows[i];
    if(!row || !row.p) return;
    tabs.push(normComp(t.competition));
    var g = bucket(t.grade);
    g.p += row.p; g.W += row.w; g.D += row.d; g.L += row.l;
    g.f += row.f; g.a += row.a;
  });

  /* Knockout rounds sit outside the tables, so add them from the results. */
  DATA.results.forEach(function(r){
    if(r.branch !== b) return;
    var rn = normComp(r.competition);
    for(var i=0;i<tabs.length;i++){
      if(rn.indexOf(tabs[i]) === 0 || tabs[i].indexOf(rn) === 0) return;
    }
    var g = bucket(r.grade);
    g.p++; g[r.outcome]++;
    g.f += r.ourTotal || 0; g.a += r.theirTotal || 0;
  });
  return by;
}

/* The grade-by-grade tally, summed to one season total for a branch - used
   both for that branch's own scoreboard below and for the Men v Ladies
   comparison, so the two always agree with each other. */
function branchTotal(b){
  var by = tally(b), order = (DATA.gradesBy || {})[b] || [];
  var have = order.filter(function(g){ return by[g]; });
  Object.keys(by).forEach(function(g){ if(have.indexOf(g) === -1) have.push(g); });
  var t = {p:0,W:0,D:0,L:0,f:0,a:0,grades:have.length};
  have.forEach(function(g){
    ['p','W','D','L','f','a'].forEach(function(k){ t[k] += by[g][k]; }); });
  return t;
}

/* A head-to-head between the branches - only meaningful with All selected,
   since comparing a branch to itself is not a comparison. Rates rather than
   raw totals where it matters: the men currently field more grades than the
   ladies, so a plain points total would read as a contest neither branch is
   actually in. */
function branchCompare(){
  var m = branchTotal('men'), l = branchTotal('ladies');
  if(!m.p || !l.p) return '';
  function pct(t){ return t.p ? Math.round((t.W + 0.5*t.D) / t.p * 100) : 0; }
  function per(n, p){ return p ? (n / p).toFixed(1) : '0.0'; }
  function row(label, mv, lv){
    return '<tr><td class="t">' + label + '</td><td>' + mv + '</td><td>' + lv + '</td></tr>';
  }
  return '<div class="panel"><span class="lbl">Season so far</span>' +
    '<h2 class="dsp">Men v Ladies</h2>' +
    '<div class="h2h" style="margin-top:6px;padding-top:0;border-top:0">' +
    '<table><thead><tr><th class="t"></th><th>Men</th><th>Ladies</th></tr></thead><tbody>' +
      row('Played', m.p, l.p) +
      row('Win rate', pct(m) + '%', pct(l) + '%') +
      row('Scored / game', per(m.f, m.p), per(l.f, l.p)) +
      row('Conceded / game', per(m.a, m.p), per(l.a, l.p)) +
    '</tbody></table></div>' +
    '<p class="fine" style="margin-top:12px">The men currently field ' + m.grades +
    ' grades and the ladies ' + l.grades + ', so Played naturally differs \u2014 ' +
    'the rest are rates, so they compare fairly either way.</p></div>';
}

function branchRecord(b){
  var t = branchTotal(b);
  var by = tally(b), order = (DATA.gradesBy || {})[b] || [];
  var have = order.filter(function(g){ return by[g]; });
  Object.keys(by).forEach(function(g){ if(have.indexOf(g) === -1) have.push(g); });
  if(!have.length) return '';
  var pct = t.p ? Math.round(t.W / t.p * 100) : 0;

  var head = mixed()
    ? '<div class="bhead"><img src="'+esc(crestOf(b))+'" width="72" height="72" loading="lazy" alt=""><b>' +
      esc(br(b).name) + '</b></div>'
    : '';

  var board = '<section class="sb"><span class="lbl">Season so far</span>' +
    '<div class="big">' +
      '<div class="wins"><u>'+t.W+'</u><span>Won</span></div>' +
      '<div><u>'+t.D+'</u><span>Drawn</span></div>' +
      '<div><u>'+t.L+'</u><span>Lost</span></div>' +
    '</div>' +
    '<div class="tot"><b>'+t.p+'</b> games \u00b7 <b>'+pct+'%</b> won \u00b7 ' +
    '<b>'+t.f+'</b> points scored, <b>'+t.a+'</b> conceded' +
    '<br><span style="opacity:.7;font-size:12.5px">Counted from the county board league tables' +
    ', plus knockout rounds.</span></div></section>';

  var rows = have.map(function(g){
    var r = by[g], gp = r.p ? Math.round(r.W / r.p * 100) : 0;
    var key = b + '|' + g, open = OPEN[key];
    return '<div class="gr'+(r.W===0?' none':'')+'" data-key="'+esc(key)+'" ' +
      'role="button" tabindex="0" aria-expanded="'+(open?'true':'false')+'">' +
      '<div class="nm"><b>'+esc(g)+'</b>' +
      '<span>'+r.p+' played \u00b7 '+r.W+'W '+r.D+'D '+r.L+'L \u00b7 '+gp+'% \u00b7 ' +
      r.f+'\u2013'+r.a+'</span></div>' +
      '<div class="w"><u>'+r.W+'</u><span>Wins</span></div>' +
      '<span class="go">' + (open ? 'Close' : 'Stats') + '<em>\u203A</em></span></div>' +
      (open ? analyse(b, g) : '');
  }).join('');

  return head + board + rows;
}
/* ---- the analysis behind each age group ----
   Split by competition, because a team's league and championship can be
   going very differently. Worked out live, so it moves with the results. */

/* Several competitions are championships played in a league format
   ("U17 B Championship - League Division 1"), so the word championship wins. */
function compKind(name){
  return String(name || '').toLowerCase().indexOf('championship') > -1
    ? 'championship' : 'league';
}

function statsFor(b, g, kind){
  var us = ourName(b);
  var out = {p:0,W:0,D:0,L:0,f:0,a:0,places:[],games:[]}, covered = [];

  DATA.tables.forEach(function(t){
    if(t.branch !== b || t.grade !== g || compKind(t.competition) !== kind) return;
    for(var i=0;i<t.rows.length;i++){
      var r = t.rows[i];
      if(r.team !== us || !r.p) continue;
      covered.push(normComp(t.competition));
      out.p += r.p; out.W += r.w; out.D += r.d; out.L += r.l;
      out.f += r.f; out.a += r.a;
      out.places.push({comp:t.competition, pos:i+1, of:t.rows.length, pts:r.pts});
    }
  });

  DATA.results.forEach(function(r){
    if(r.branch !== b || r.grade !== g || compKind(r.competition) !== kind) return;
    out.games.push(r);
    var rn = normComp(r.competition);
    for(var i=0;i<covered.length;i++){
      if(rn.indexOf(covered[i]) === 0 || covered[i].indexOf(rn) === 0) return;
    }
    out.p++; out[r.outcome]++;
    out.f += r.ourTotal || 0; out.a += r.theirTotal || 0;
  });

  out.games.sort(function(x,y){ return x.date < y.date ? 1 : -1; });
  return out;
}

/* ---- compared to whoever is next up in this exact competition ----
   Read straight off the same league table used everywhere else on this
   page, so it is exactly as live as the table itself - no separate fetch,
   no separate source of truth. Both sides come from the official table,
   rather than mixing in the knockout-round top-up used for Killeshin's own
   headline figures above, so the two numbers being placed side by side are
   always counted the same way. */
function tableRowIn(b, g, kind, team){
  var row = null;
  DATA.tables.forEach(function(t){
    if(t.branch !== b || t.grade !== g || compKind(t.competition) !== kind) return;
    t.rows.forEach(function(r){ if(r.team === team) row = r; });
  });
  return row;
}
function nextOpponentIn(b, g, kind){
  var next = upcoming().filter(function(f){
    return f.branch === b && f.grade === g && compKind(f.competition) === kind;
  }).sort(function(x,y){ return x.date < y.date ? -1 : (x.date > y.date ? 1 : 0); })[0];
  return next ? next.opponent : null;
}
function opponentCompare(b, g, kind){
  var opp = nextOpponentIn(b, g, kind);
  if(!opp) return '';
  var us = tableRowIn(b, g, kind, ourName(b));
  var them = tableRowIn(b, g, kind, opp);
  if(!us || !them || !us.p || !them.p) return '';   /* need a real season from both sides */

  return '<h4>Compared to ' + esc(label(opp, b)) + '</h4>' +
    '<div class="h2h" style="margin-top:0;padding-top:0;border-top:0">' +
    '<table><thead><tr><th class="t">Team</th><th>P</th><th>Scored</th><th>Conceded</th></tr></thead>' +
    '<tbody><tr class="us"><td class="t">Killeshin</td><td>'+us.p+'</td><td>'+us.f+'</td><td>'+us.a+'</td></tr>' +
    '<tr><td class="t">'+esc(label(opp,b))+'</td><td>'+them.p+'</td><td>'+them.f+'</td><td>'+them.a+'</td></tr>' +
    '</tbody></table></div>';
}

function analyse(b, g){
  var key = b + '|' + g;
  var kinds = [];
  ['championship','league'].forEach(function(k){
    var st = statsFor(b, g, k);
    if(st.p > 0 || st.games.length) kinds.push({k:k, st:st});
  });
  if(!kinds.length) return '';

  /* Default to whichever the team has played most of. */
  var pick = SUBTAB[key];
  if(!pick || !kinds.some(function(x){ return x.k === pick; })){
    pick = kinds.slice().sort(function(x,y){ return y.st.p - x.st.p; })[0].k;
  }
  var cur = kinds.filter(function(x){ return x.k === pick; })[0].st;

  var tabs = kinds.length > 1
    ? '<div class="ktabs">' + kinds.map(function(x){
        return '<button data-k="'+esc(key)+'" data-kind="'+x.k+'" aria-pressed="' +
          (x.k === pick) + '">' + (x.k === 'league' ? 'League' : 'Championship') +
          '</button>'; }).join('') + '</div>'
    : '<div class="konly">' + (pick === 'league' ? 'League only' : 'Championship only') +
      ' \u2014 no ' + (pick === 'league' ? 'championship' : 'league') +
      ' for this age group</div>';

  return '<div class="an">' + tabs + panelFor(b, g, pick, cur) + '</div>';
}

function panelFor(b, g, kind, t){
  var played = t.p || t.games.length;
  if(!played) return '<p class="note">Nothing played yet.</p>';

  var winPct = Math.round((t.W + 0.5*t.D) / played * 100);
  var per = (t.f - t.a) / played;
  var scored = t.f / played, letIn = t.a / played;

  var winScore = (t.W + 0.5*t.D) / played * 10;
  var margScore = Math.max(0, Math.min(10, 5 + per/3));
  var posScore = t.places.length
    ? t.places.reduce(function(a,p){ return a + (p.of-p.pos)/(p.of-1); }, 0) / t.places.length * 10
    : winScore;
  var rating = Math.round((0.45*winScore + 0.35*margScore + 0.20*posScore) * 10) / 10;

  /* form: oldest on the left, newest on the right */
  var last = t.games.slice(0, 5).reverse();
  var form = last.length
    ? '<div class="form"><span class="lbl">Last ' + last.length + '</span>' +
      last.map(function(r){
        return '<i class="'+r.outcome+'" title="'+esc(label(r.opponent, r.branch))+'">' +
               r.outcome + '</i>'; }).join('') + '</div>'
    : '';

  var home = t.games.filter(function(r){ return atHome(r); });
  var away = t.games.filter(function(r){ return !atHome(r); });
  function wl(l){ return l.filter(function(r){return r.outcome==='W';}).length + 'W-' +
                         l.filter(function(r){return r.outcome==='L';}).length + 'L'; }
  var best=null, worst=null;
  t.games.forEach(function(r){
    var m = r.ourTotal - r.theirTotal;
    if(!best || m > best.ourTotal - best.theirTotal) best = r;
    if(!worst || m < worst.ourTotal - worst.theirTotal) worst = r;
  });

  var v = [];
  v.push(rating >= 7 ? 'A strong ' + kind + ' campaign.'
       : rating >= 5.5 ? 'Winning more than losing in the ' + kind + '.'
       : rating >= 4   ? 'Competitive without pulling away.'
       : 'Hard going in the ' + kind + '.');
  if(per >= 8) v.push('Winning comfortably \u2014 ' + Math.round(scored) + ' points a game to ' +
      Math.round(letIn) + '.');
  else if(per <= -8) v.push('Defeats have been heavy, conceding ' + Math.round(letIn) +
      ' a game against ' + Math.round(scored) + ' scored.');
  else if(Math.abs(per) < 3) v.push('Tight games either way, an average margin of ' +
      (per>=0?'+':'') + per.toFixed(1) + '.');
  else if(per > 0) v.push('Winning by a working margin, ' + scored.toFixed(1) + ' to ' + letIn.toFixed(1) + '.');
  else v.push('Losing narrowly more often than heavily \u2014 ' + scored.toFixed(1) +
      ' to ' + letIn.toFixed(1) + ', so the gap is closeable.');

  if(home.length >= 2 && away.length >= 2){
    var hw = home.filter(function(r){return r.outcome==='W';}).length/home.length;
    var aw = away.filter(function(r){return r.outcome==='W';}).length/away.length;
    if(hw - aw >= 0.34) v.push('Better at home (' + wl(home) + ') than away (' + wl(away) + ').');
    else if(aw - hw >= 0.34) v.push('Travelling well \u2014 ' + wl(away) + ' away, ' + wl(home) + ' at home.');
  }
  if(played < 4) v.push('Only ' + played + ' games, so treat this lightly.');

  var standing = t.places.map(function(p){
    return '<span class="pill' + (p.pos <= Math.ceil(p.of/2) ? '' : ' bad') + '">' +
      esc(p.comp) + ' \u2014 ' + p.pos + ordinal(p.pos) + ' of ' + p.of + '</span>';
  }).join('');

  return '<div class="rate"><u>' + rating.toFixed(1) + '<i>/10</i></u>' +
      '<span class="bar"><span style="width:' + (rating*10) + '%"></span></span></div>' +
    (form ? form + '<div style="height:14px"></div>' : '') +
    '<div class="grid">' +
      cell(t.W + '<span style="font-size:14px;color:var(--grey-lt)">/' + played + '</span>', 'Won') +
      cell(winPct + '%', 'Win rate') +
      cell((per>=0?'+':'') + per.toFixed(1), 'Margin a game') +
      cell(scored.toFixed(1) + '<span style="font-size:14px;color:var(--grey-lt)">\u2013' +
           letIn.toFixed(1) + '</span>', 'Scored / let in') +
    '</div>' +
    (standing ? '<h4>Where they stand</h4><p class="standing">' + standing + '</p>' : '') +
    opponentCompare(b, g, kind) +
    '<h4>The season in short</h4><p>' + v.join(' ') + '</p>' +
    (best && worst && t.games.length >= 2 ?
      '<h4>Best and worst</h4><p class="standing">' +
      '<b>Biggest win</b> \u2014 ' + esc(scoreText(best)) + '<br>' +
      '<b>Heaviest defeat</b> \u2014 ' + esc(scoreText(worst)) + '</p>' : '') +
    '<p class="note">Played, won and lost come from the county board tables. ' +
    'Form and margins use the ' + t.games.length + ' matches published in full.</p>';
}

function cell(a,b){ return '<div class="cell"><b>'+a+'</b><span>'+b+'</span></div>'; }
function ordinal(n){
  return n===1?'st':n===2?'nd':n===3?'rd':'th'; }
function scoreText(r){
  return label(r.opponent, r.branch) + ' ' + (r.isHome ? '(h)' : '(a)') + ' ' +
    (r.isHome ? r.homeScore + ' v ' + r.awayScore : r.awayScore + ' v ' + r.homeScore) +
    '  \u00b7  ' + shortDate(r.date);
}

var OPEN = {}, SUBTAB = {};
function renderRecord(){
  var compare = branch === 'all' ? branchCompare() : '';
  var out = branch === 'all'
    ? branchRecord('men') + branchRecord('ladies')
    : branchRecord(branch);
  if(!out) return empty('No record yet', 'Once games are played the wins add up here.');
  return compare + '<p class="hint">Tap any team for a full breakdown \u2014 rating, form, ' +
         'where they stand and how the season has gone.</p>' + out;
}

/* ---- news ---- */
function renderNews(){
  var all = DATA.news || [];
  if(!all.length) return empty('Nothing in the papers',
    'Anything the local papers publish about Killeshin lands here within a day.');
  var free = all.filter(function(n){ return n.access !== 'subscriber'; });
  var paid = all.filter(function(n){ return n.access === 'subscriber'; });
  var html = '';
  if(free.length){
    html += sec('Free to read','Open these and read the whole story, no account needed.') +
      free.map(function(n,i){ return story(n, i===0); }).join('');
  } else {
    html += empty('Nothing free this week','The subscriber stories below are all that came up.');
  }
  if(paid.length){
    html += '<div class="paid">' +
      sec('Behind a subscription','You will hit a paywall on these. Headline and link only.') +
      paid.map(function(n){ return story(n,false); }).join('') + '</div>';
  }
  return html;
}
function sec(t,p){ return '<div class="sec"><span class="lbl">'+esc(t)+'</span><p>'+esc(p)+'</p></div>'; }
function story(n, lead){
  var age = -daysAway(n.date), when = shortDate(n.date);
  if(age === 0) when = 'Today'; else if(age === 1) when = 'Yesterday';
  else if(age > 1 && age < 7) when = age + ' days ago';
  return '<a class="story'+(lead?' lead':'')+'" href="'+esc(n.url)+'" target="_blank" rel="noopener">' +
    '<h3>'+esc(n.title)+'</h3><div class="by"><b>'+esc(n.source)+'</b> <s>\u00b7</s> '+esc(when) +
    (n.tag ? ' <s>\u00b7</s> '+esc(n.tag) : '') +
    (n.access==='subscriber' ? ' <s>\u00b7</s> Subscribers' : '') + '</div></a>';
}

/* ---- alerts ---- */
function renderAlerts(){
  var host = location.host + location.pathname.replace(/[^/]*$/,'');
  var link = function(key, label, alt){
    return '<a class="btn'+(alt?' alt':'')+'" href="webcal://'+esc(host)+'killeshin-'+key+'.ics">' +
           esc(label) + '</a>';
  };

  var mine = '';
  if(MINE.length){
    var feeds = DATA.teamFeeds || {};
    var rows = MINE.map(function(id){

      if(age === 0) when = 'Today'; else if(age === 1) when = 'Yesterday';
      else if(age > 1 && age < 7) when = age + ' days ago';

        ? '<h4>Roll of honour</h4><ul>' +
          facts.honours.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('') + '</ul>'
        : '') + '</div>';
  }
  return html;
}

/* Jumping to the very top meant scrolling back past the hero every time a
   tab was tapped. Instead, land on the tab bar - or stay put if already
   above it. Expanding a row or a background refresh must not move at all. */
/* Switching tab puts you at the top of the new list, with the hero and
   next-at-home panels scrolled out of the way. Opening the app still
   shows them. */
function draw(scroll){
  var out = document.getElementById('out');
  try { drawInner(); filters(); }
  catch(err){
    console.error(err);
    out.innerHTML = empty('Something went wrong', 'Pull down to refresh.');
  }
  homePanels();
  if(scroll !== false){
    /* Each page now starts clean, so the top of the page is the right place. */
    window.scrollTo(0, 0);
    /* restart the animation: strip the class, force a reflow, put it back */
    out.classList.remove('swap');
    void out.offsetWidth;
    out.classList.add('swap');
  }
}

/* ---- visitor counter ----
   A free third-party tally. If it is ever unreachable the badge simply
   stays hidden rather than showing a broken number. */
/* Tell GoatCounter which tab was opened, so the dashboard shows what people
   actually use, not just that they arrived. Silent if the script is blocked. */
function count(path){
  try {
    if(window.goatcounter && window.goatcounter.count){
      window.goatcounter.count({path: path, event: false});
    }
  } catch(err){ /* stats must never break the app */ }
}

/* Crests and form live in their own files so an index.html upload cannot
   wipe them. Read them straight from there. */
function looseKey(n){
  return String(n || '').toLowerCase()
    .replace(/\b(gaa|clg|club|lgfa|ladies)\b/g, ' ')
    .replace(/[^a-z0-9]/g, '');
}
/* The live data lives in data.json. The copy inside this page is only a
   fallback for the first paint and for anyone opening it offline, so
   replacing index.html never throws the season back to when it was built. */
function loadData(){
  fetch('data.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      if(!j || !j.fixtures || !j.results || !j.branches || !j.gradesBy) return;
      var keep = {crests: DATA.crests, form: DATA.form};
      DATA = j;
      if(keep.crests) DATA.crests = keep.crests;
      if(keep.form) DATA.form = keep.form;
      if(grade !== 'All' && grade !== '__mine' && grades().indexOf(grade) === -1) grade = 'All';
      renderNext(); draw(false);
      try { stamp(); } catch(err){ /* leave the footer as it was */ }
    })
    .catch(function(){ /* the built-in copy stands in */ });
}

function loadCrests(){
  fetch('crests.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      if(!j || typeof j !== 'object') return;
      var merged = {}, k;
      for(k in (DATA.crests || {})) merged[k] = DATA.crests[k];
      var loose = {};
      for(k in j) loose[looseKey(k)] = j[k];
      (DATA.fixtures || []).concat(DATA.results || []).forEach(function(m){
        [m.home, m.away, m.opponent].forEach(function(n){
          if(n && !merged[n] && loose[looseKey(n)]) merged[n] = loose[looseKey(n)];
        });
      });
      DATA.crests = merged;
      renderNext(); draw(false);
    })
    .catch(function(){ /* initials will stand in */ });
}
function loadForm(){
  fetch('form.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      if(!j || typeof j !== 'object') return;
      DATA.form = j;
      renderNext(); draw(false);
    })
    .catch(function(){ /* no form markers, no harm */ });
}

function counter(){
  var el = document.getElementById('count');
  if(!el) return;

  function show(n){
    var clean = String(n).replace(/[^0-9]/g, '');
    if(!clean) return false;
    var v = Number(clean);
    el.hidden = false;
    el.textContent = '\u25C9 ' + v.toLocaleString() + (v === 1 ? ' visit' : ' visits');
    return true;
  }

  /* GoatCounter is already counting every visit, so use its own total rather
     than a third-party tally. Needs "Allow adding visitor counts on your
     website" switched on in the GoatCounter site settings. */
  var tries = [
    { url: 'https://killeshin.goatcounter.com/counter/TOTAL.json',
      read: function(j){ return j && j.count; } },
    { url: 'https://api.counterapi.dev/v1/killeshingaa/app/up',
      read: function(j){ return j && (j.count != null ? j.count : j.value); } }
  ];

  function attempt(i){
    if(i >= tries.length) return;              /* stay hidden rather than show nothing */
    fetch(tries[i].url, {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ if(!show(tries[i].read(j))) throw 0; })
      .catch(function(){ attempt(i + 1); });
  }
  attempt(0);
  /* Check again every minute so the number moves while the app is open. */
  setInterval(function(){ attempt(0); }, 60000);
}

function showBranch(){
  document.querySelectorAll('.br').forEach(function(x){
    x.setAttribute('aria-pressed', String(x.dataset.b === branch)); });
  var b = branch === 'ladies' ? 'ladies' : 'men';
  var c = document.getElementById('mastCrest'); if(c) c.src = crestOf(b);
  var sub = document.getElementById('mastSub');
  if(sub) sub.textContent =
    branch === 'ladies' ? 'Killeshin Ladies' : 'Killeshin GAA';
}

function boot(first){
  try { renderNext(); } catch(err){ console.error(err);
    document.getElementById('hero').hidden = true;
    document.getElementById('athome').hidden = true; }
  try { showBranch(); } catch(err){ console.error(err); }
  draw(first !== true);
  try { markTabs(); } catch(err){ console.error(err); }
  try { promo(); } catch(err){ console.error(err); }
  try { stamp(); } catch(err){ console.error(err); }
}
loadMine();
loadPrefs();
boot(true);
counter();
loadData();
loadCrests();
loadForm();

/* Tick every half minute: refreshes the countdown, and rolls straight on to
   the following game the moment throw-in passes - no reload needed. */
setInterval(function(){
  try { renderNext(); if(view === 'fixtures') draw(false); } catch(err){ console.error(err); }
}, 30000);

/* Data lives in the seed block above. update.py rewrites it in place, so
   there is no second file to fall out of step with this one. */
})();
</script>
