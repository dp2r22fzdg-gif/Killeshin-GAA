name: Update fixtures

on:
  schedule:
    - cron: '10 5,17 * * *'      # ~06:10 and 18:10 Irish time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4

      - name: Gather local news
        run: python news.py
        continue-on-error: true      # a paper being down must not block fixtures

      - name: Scrape both county boards
        run: python scrape.py        # also rebuilds the .ics calendar feeds

      - name: Commit if anything changed
        run: |
          git config user.name  "Killeshin GAA bot"
          git config user.email "actions@github.com"
          git add killeshin.json news.json killeshin-*.ics
          if git diff --staged --quiet; then
            echo "No change today."
          else
            git commit -m "Update $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
